<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Territory Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without blocking the page; if Google Fonts is unreachable, system fonts take over -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&display=swap"></noscript>
<style>
:root {
  --bg: #F4F6F5; --surface: #FFFFFF; --surface2: #F4F6F5; --ink: #0E1A17; --muted: #55645F; --line: #DCE2DF; --line2: #E7ECEA;
  --accent: #0E1A17; --accent-ink: #FFFFFF; --focus: #3B4FD8; --topbg: #0E1A17; --topfg: #FFFFFF; --topline: #3A4A45; --topmuted: #B9C6C1;
  --ok: #167A4E; --wait: #5B3FA6; --hold: #8F4A00; --no: #B42318; --gone: #7B8794;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141A; --surface: #151D25; --surface2: #1A242E; --ink: #E6EBF1; --muted: #9AA8B7; --line: #2A3643; --line2: #222D38;
    --accent: #E6EBF1; --accent-ink: #0E141A; --focus: #8AA4FF; --topbg: #0A0F14; --topline: #2A3643;
    --ok: #4CC38A; --wait: #A995EE; --hold: #E5A649; --no: #F2877E; --gone: #8A97A5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #151D25; --surface2: #1A242E; --ink: #E6EBF1; --muted: #9AA8B7; --line: #2A3643; --line2: #222D38;
  --accent: #E6EBF1; --accent-ink: #0E141A; --focus: #8AA4FF; --topbg: #0A0F14; --topline: #2A3643;
  --ok: #4CC38A; --wait: #A995EE; --hold: #E5A649; --no: #F2877E; --gone: #8A97A5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); } .sm { font-size: 13px; } .pad { padding: 18px; }
.grow { flex: 1; }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; height: calc(52px + env(safe-area-inset-top, 0px)); background: var(--topbg); color: var(--topfg); border-bottom: 1px solid var(--topline);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; }
.brand small { display: none; }
.top-file { margin-left: 6px; padding-left: 14px; border-left: 1px solid var(--topline); color: var(--topmuted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
body:not(.has-data) .top-file, body:not(.has-data) #exportbtn { display: none; }
@media (min-width: 900px) { .nav-foot { display: none; } }
.top .btn { height: 34px; padding: 0 12px; font-size: 13px; background: transparent; color: var(--topfg); border-color: var(--topline); border-radius: 8px; }
.top .btn:hover { border-color: var(--topfg); }
.top .btn.primary { background: var(--topfg); color: var(--topbg); border-color: var(--topfg); }
.top .btn.ghost { border-color: transparent; color: var(--topmuted); } .top .btn.ghost:hover { color: var(--topfg); background: transparent; }
.top #askbtn[aria-expanded="true"] { background: rgba(255, 255, 255, .14); border-color: var(--topfg); color: var(--topfg); }
.logo { width: 26px; height: 26px; flex: none; }
.top .actions { display: flex; gap: 8px; margin-left: auto; align-items: center; }
body:not(.has-data) #askbtn { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); } .btn.ghost:hover { color: var(--ink); background: var(--surface2); }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn[disabled], .link[disabled] { opacity: .4; cursor: default; }

.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: inherit; text-align: left; }
.icon-b { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; color: var(--muted); flex: none; }
.icon-b:hover { color: var(--ink); border-color: var(--accent); }
#err { margin: 12px auto 0; max-width: 980px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--no); color: var(--no); background: color-mix(in srgb, var(--no) 8%, var(--surface)); }

/* start screen: a work screen, not a landing page */
.empty { max-width: 1040px; margin: 0 auto; padding: 32px 24px 56px; display: flex; flex-direction: column; gap: 18px; }
.empty h1 { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.01em; }
.lede { font-size: 14.5px; color: var(--muted); max-width: 70ch; }
.lede.sm { margin-bottom: 14px; }
.st-grid { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
.st-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.st-card h2 { font-size: 14px; font-weight: 600; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 24px 18px; display: flex; gap: 14px 18px; align-items: center; flex-wrap: wrap; background: var(--bg); transition: border-color .15s; }
.drop:hover { border-color: var(--ink); }
.drop > div:nth-child(2) { flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px; }
.drop-i { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); position: relative; flex: none; }
.drop-i::before { content: ""; position: absolute; inset: 14px 12px 10px; border: 2px solid var(--ink); border-top: 0; border-radius: 0 0 4px 4px; }
.drop-i::after { content: ""; position: absolute; left: 50%; top: 9px; width: 2px; height: 16px; background: var(--ink); transform: translateX(-50%); }
.drop-b { display: flex; gap: 8px; flex-wrap: wrap; }
.st-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; font-size: 14px; }
.st-list li { display: flex; gap: 10px; } .st-list i { flex: none; margin-top: 7px; width: 7px; height: 7px; border-radius: 50%; }
.st-rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.st-rules > div { padding: 12px 16px; border-top: 1px solid var(--line2); font-size: 14px; } .st-rules b { display: block; font-weight: 600; } .st-rules span { font-size: 13px; color: var(--muted); }
.fine { font-size: 13px; color: var(--muted); }

/* app shell: sidebar, page, ask panel */
.shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: calc(100vh - 52px); }
.side { position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px; display: flex; flex-direction: column; gap: 14px; }
.nav-g p { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 10px 4px; }
.nav-i { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: none; font-size: 14px; font-weight: 500; color: var(--ink); text-align: left; position: relative; }
.nav-i:hover { background: var(--surface2); }
.nav-i.on { background: var(--ink); color: var(--bg); font-weight: 700; }
.nav-i.on::before { display: none; }
.nb { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface2); border-radius: 999px; padding: 0 7px; }
.nav-i.on .nb { color: color-mix(in srgb, var(--bg) 72%, transparent); background: transparent; }
.nav-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.nav-foot p { margin: 0; }
.main { min-width: 0; padding: 16px 20px 40px; container-type: inline-size; }
/* when the page column is narrow (Ask panel open on a laptop), rows switch to the compact layout */


.main > * { max-width: 1180px; }
.page-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-h h1 { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.summary { margin-bottom: 12px; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.kpi { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px; transition: border-color .15s; }
.kpi:hover { border-color: var(--ink); }
.kpi.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.kpi span { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.kpi b { font-family: var(--display); font-size: 26px; line-height: 1.1; font-weight: 800; }
.sum-meta { font-size: 13px; color: var(--muted); margin: 0 2px 10px; }
.attn { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-bottom: 12px; padding: 9px 14px; border-radius: 10px; background: color-mix(in srgb, var(--hold) 11%, var(--surface)); border: 1px solid color-mix(in srgb, var(--hold) 32%, transparent); color: var(--ink); font-size: 14px; }
.attn b { color: var(--hold); } .attn .grow { flex: 1; } .attn .link { font-weight: 600; }




.seg { display: block; min-width: 6px; background: var(--c, var(--gone)); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.ok { --c: var(--ok); } .wait { --c: var(--wait); } .hold { --c: var(--hold); } .no { --c: var(--no); } .gone { --c: var(--gone); }
.notices { margin-bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--hold); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
.notices summary { cursor: pointer; font-weight: 600; } .notices p { margin: 6px 0 0; }
.tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.tab { white-space: nowrap; background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; font-weight: 500; text-align: left; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fchip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 500; }
.fchip b { font-weight: 700; } .fchip:hover { border-color: var(--accent); }
.fchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; min-width: 240px; }

/* decision rows */
.rows { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rows-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.rows-tools .search { flex: 1 1 240px; height: 36px; padding: 0 12px; border-radius: 8px; }
.rows-tools .count { color: var(--muted); font-size: 13px; }
.row-head, .row-h { display: grid; grid-template-columns: 70px minmax(120px, 1.1fr) 56px 214px 46px minmax(0, 1.6fr) minmax(0, 1fr) 14px; gap: 10px; align-items: center; }
.row-head { padding: 7px 14px; background: var(--surface2); color: var(--muted); font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line); }
.row-head span:nth-child(5) { text-align: right; }
.rter { color: var(--muted); font-size: 13px; } .ract { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { position: relative; background: var(--surface); border: 0; border-top: 1px solid var(--line2); border-radius: 0; }
.row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c, transparent); }
.row-head + .row { border-top: 0; }
.row.open { background: color-mix(in srgb, var(--ink) 3%, var(--surface)); }
.row.gone { opacity: .7; }
.row-h { width: 100%; background: none; border: 0; text-align: left; padding: 9px 14px; }
.row.gone .row-h { grid-template-columns: 70px minmax(120px, 1.1fr) 56px 214px 1fr; }
.rid { font-weight: 600; white-space: nowrap; }
.rname { display: flex; flex-direction: column; line-height: 1.25; font-weight: 600; font-size: 14px; }
.rname small { color: var(--muted); font-weight: 400; font-size: 12px; }
.rout { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.was { font-size: 12px; color: var(--muted); }
.score { font-weight: 700; font-size: 14.5px; text-align: right; }
.score.off { color: var(--muted); font-weight: 400; }
.rwhy { color: var(--ink); opacity: .82; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.open .rwhy { white-space: normal; }
.chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); justify-self: center; transition: transform .15s; }
.row.open .chev { transform: rotate(-135deg); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); white-space: nowrap; }
.pill.sm { padding: 0 8px; font-size: 12px; }

.detail { border-top: 1px solid var(--line); }
.dtabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.dtab { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 12px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.dtab:hover { color: var(--ink); } .dtab.on { color: var(--accent); border-bottom-color: var(--accent); }
.dbody { padding: 6px 18px 18px; max-width: 780px; }
.dbody h4 { font-family: var(--display); font-size: 15px; margin: 16px 0 6px; }
.dbody > h4:first-child { margin-top: 12px; }
.dbody h4.lead-h { font-size: 16.5px; }
.dbody p { font-size: 14.5px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .btn-row p { margin: 0; }
.cond { background: var(--surface2); border-radius: 6px; padding: 8px 10px; font-size: 13.5px !important; }
.tl { list-style: none; margin: 8px 0; padding: 0; }
.tl li { border-left: 2px solid var(--line); padding: 0 0 12px 14px; position: relative; font-size: 14.5px; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl li b { font-weight: 600; margin-right: 6px; }
.tl li span { display: block; color: var(--muted); font-size: 13.5px; }
.bp { margin-bottom: 9px; }
.bp-l { display: flex; justify-content: space-between; font-size: 13.5px; }
.bp-l small { color: var(--muted); font-weight: 400; }
.track { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin: 3px 0 2px; border: 1px solid var(--line); }
.track i { display: block; height: 100%; background: var(--accent); }
.flags { list-style: none; padding: 0; margin: 0; }
.fl { display: flex; gap: 9px; font-size: 13.5px; margin-bottom: 6px; }
.fdot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--gone); }
.fl.hold .fdot { background: var(--hold); } .fl.reject .fdot { background: var(--no); } .fl.soft .fdot { background: var(--wait); } .fl.clean .fdot { background: var(--ok); }
.seg-g { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.seg-b { background: var(--surface); border: 0; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.seg-b.on { background: var(--accent); color: var(--accent-ink); }
.letter { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; line-height: 1.6; margin-bottom: 8px; }
.letter[lang="hi"] { font-family: 'Noto Sans Devanagari', 'Nirmala UI', Mangal, 'Kohinoor Devanagari', 'Devanagari Sangam MN', var(--body); }
.letter[lang="kn"] { font-family: 'Noto Sans Kannada', 'Nirmala UI', Tunga, 'Kannada Sangam MN', var(--body); }
.rec { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; font-size: 13.5px; margin: 0; }
.rec dt { color: var(--muted); } .rec dd { margin: 0; }

/* pin board */
.b-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.b-legend span { display: inline-flex; align-items: center; gap: 7px; }
.b-legend .tile { width: 24px; height: 16px; padding: 0; border-radius: 4px; }
.board { display: flex; flex-direction: column; gap: 14px; }
.terr { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; margin-bottom: 0; }
.terr header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.terr h3 { font-family: var(--display); font-size: 17px; font-weight: 800; }
.slots { display: flex; align-items: center; gap: 8px; }
.dots { display: inline-flex; gap: 4px; }
.sdot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ok); display: block; }
.sdot.on { background: var(--ok); }
.slots small { color: var(--muted); font-size: 12.5px; }
.tiles, .outside { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; width: 104px; height: 64px; padding: 7px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; }
.tile b { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--muted); letter-spacing: 0.01em; }
.tile b u { text-decoration: none; font-weight: 800; color: var(--ink); }
.tile span { font-size: 12.5px; font-weight: 600; }
.tile em { position: absolute; bottom: 7px; right: 9px; font-style: normal; font-size: 12px; font-weight: 600; color: var(--wait); }
.t-open span { color: var(--muted); font-weight: 400; }
.t-store { border-style: dashed; background: repeating-linear-gradient(135deg, var(--surface2) 0 6px, var(--surface) 6px 12px); }
.t-store span { color: var(--muted); }
.t-ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, var(--surface)); } .t-ok span { color: var(--ok); }
.t-wait { border-color: var(--wait); background: color-mix(in srgb, var(--wait) 11%, var(--surface)); } .t-wait span { color: var(--wait); }
.t-hold { border-color: var(--hold); border-style: dotted; background: color-mix(in srgb, var(--hold) 9%, var(--surface)); } .t-hold span { color: var(--hold); }
button.tile:hover { transform: translateY(-1px); }

/* assumptions */
.assume .a-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.assume section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.assume section.wide { grid-column: 1 / -1; }
.assume h4 { font-family: var(--display); font-size: 15px; margin-bottom: 8px; }
.assume h4.mt { margin: 22px 0 8px; }
.a-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px; }
.fld { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.fld input { width: 74px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); text-align: right; }
.w-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 22px; }
.rules { padding-left: 20px; font-size: 14px; color: var(--muted); }
.rules li { margin-bottom: 4px; }

/* ask panel: a column on wide screens, a drawer below 1280 px */
.ask { display: none; }
.shell.ask-open { grid-template-columns: 200px minmax(0, 1fr) 380px; }
.shell.ask-open .ask { display: block; position: sticky; top: 58px; height: calc(100vh - 58px); border-left: 1px solid var(--line); background: var(--surface); }
.ask-scrim { display: none; }
.ask-in { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
.ask-in header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ask-in h2 { font-family: var(--display); font-size: 18px; font-weight: 800; }
.ask-empty p { color: var(--muted); font-size: 13.5px; margin: 0; }
.log.is-empty { flex: 0 0 auto; min-height: 0; }
.log { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 60px; flex: 1 1 auto; padding-right: 2px; }
.msg { border-radius: 12px; padding: 9px 12px; font-size: 14px; max-width: 100%; }
.msg p { font-size: 14px; margin-bottom: 6px; } .msg p:last-child { margin-bottom: 0; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); max-width: 88%; border-bottom-right-radius: 4px; }
.msg.desk { background: var(--surface2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg .nx { color: var(--muted); }
.msg .ap { font-weight: 500; }
.diff { list-style: none; padding: 0; margin: 4px 0 8px; font-size: 13.5px; }
.diff li { padding: 3px 0; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg .chip { font-size: 13px; padding: 3px 10px; }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; background: var(--surface); }
.composer input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.ask-tools { display: flex; justify-content: space-between; font-size: 13px; }
.cmp { border-collapse: collapse; font-size: 13.5px; width: 100%; }
.cmp th, .cmp td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp .tot td { font-weight: 600; }

/* compact rows when the page column is narrow (Ask panel open on a laptop, or a phone); after the base rules so it wins */
@container (max-width: 820px) {
  .row-head { display: none; }
  .row-h { grid-template-columns: auto minmax(0, 1fr) auto 44px 14px; row-gap: 2px; }
  .rid { grid-column: 1; } .rname { grid-column: 2; } .rout { grid-column: 3; justify-content: flex-end; } .score { grid-column: 4; } .chev { grid-column: 5; grid-row: 1; }
  .rter, .ract { display: none; }
  .rwhy { grid-column: 1 / -1; grid-row: 2; white-space: normal; }
  .row.open .row-h .rwhy { display: none; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1279px) {
  .shell.ask-open { grid-template-columns: 200px minmax(0, 1fr); }
  .shell.ask-open .ask { position: fixed; top: 58px; right: 0; bottom: 0; height: auto; width: min(400px, 100vw); z-index: 40; box-shadow: -12px 0 32px rgba(0, 0, 0, .18); }
  .shell.ask-open .ask-scrim { display: block; position: fixed; inset: 58px 0 0 0; z-index: 39; border: 0; background: rgba(10, 16, 24, .28); }
}
@media (max-width: 899px) {
  .shell, .shell.ask-open { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 58px; z-index: 20; height: auto; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px 10px; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .nav-g { display: flex; gap: 2px; } .nav-g p { display: none; }
  .nav-i { width: auto; white-space: nowrap; padding: 6px 10px; font-size: 14px; } .nav-i.on::before { display: none; }
  .nav-foot { margin: 0; padding: 0 0 0 6px; border: 0; flex-direction: row; } .nav-foot p { display: none; }
  .main { padding: 14px 14px 40px; }
  .page-h h1 { font-size: 21px; }
  .search { min-width: 0; width: 100%; }
  .steps { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .row-h { grid-template-columns: auto minmax(0, 1fr) auto 14px; row-gap: 4px; }
  .chev { grid-column: 4; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi:first-child { grid-column: 1 / -1; }
  .brand small { display: none; }
  .row-h .score { display: none; }
  .row-h .rwhy { grid-column: 1 / -1; white-space: normal; }
  .rout { grid-column: 3; flex-wrap: wrap; justify-content: flex-end; }
  .assume .a-grid { grid-template-columns: minmax(0, 1fr); }
  .w-grid { grid-template-columns: minmax(0, 1fr); }
  .top .actions .hide-s { display: none; }
  .row-h .conf, .row-h .ovl { display: none; }
  .top { gap: 8px; } .brand { font-size: 17px; } .top .btn { padding: 7px 11px; }
  .shell.ask-open .ask { width: 100vw; }
  .dbody { padding: 4px 14px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } button.tile:hover { transform: none; } }
</style>
