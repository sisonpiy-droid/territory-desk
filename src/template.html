<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Territory Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without blocking the page; if Google Fonts is unreachable, system fonts take over -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&display=swap"></noscript>
<style>
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface2: #f5f7fa; --ink: #16202c; --muted: #5d6b7a; --line: #d8dee6;
  --accent: #2447b8; --accent-ink: #ffffff;
  --ok: #17794f; --wait: #6a4fb0; --hold: #a8620a; --no: #b42318; --gone: #7b8794;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #171f28; --surface2: #1d2631; --ink: #e6ebf1; --muted: #9aa8b7; --line: #2b3745;
    --accent: #8aa4ff; --accent-ink: #0f151c; --ok: #4cc38a; --wait: #a995ee; --hold: #e5a649; --no: #f2877e; --gone: #8a97a5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #171f28; --surface2: #1d2631; --ink: #e6ebf1; --muted: #9aa8b7; --line: #2b3745;
  --accent: #8aa4ff; --accent-ink: #0f151c; --ok: #4cc38a; --wait: #a995ee; --hold: #e5a649; --no: #f2877e; --gone: #8a97a5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); } .sm { font-size: 13px; } .pad { padding: 18px; }
.grow { flex: 1; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
.brand small { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.logo { width: 26px; height: 26px; }
.top .actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.top .jump-ask { display: none; text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn[disabled], .link[disabled] { opacity: .4; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: inherit; text-align: left; }
#err { margin: 12px max(18px, env(safe-area-inset-left, 0px)) 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--no); color: var(--no); background: color-mix(in srgb, var(--no) 8%, var(--surface)); }

/* empty state */
.empty { max-width: 760px; margin: 0 auto; padding: 8vh 22px 10vh; }
.empty h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 5.4vw, 52px); line-height: 1.04; letter-spacing: -0.02em; margin-bottom: 16px; }
.lede { font-size: 17px; color: var(--muted); max-width: 60ch; }
.lede.sm { font-size: 14.5px; margin-bottom: 14px; }
.drop { margin-top: 26px; border: 2px dashed var(--line); border-radius: 14px; padding: 30px 22px; display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; background: var(--surface); }
.drop span { color: var(--muted); }
.fine { margin-top: 16px; font-size: 13px; color: var(--muted); }

/* workspace */
.workspace { max-width: 1480px; margin: 0 auto; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 40px max(18px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 22px; align-items: start; }
.primary { min-width: 0; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.sum-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sum-top h2 { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.sum-meta { font-size: 13.5px; color: var(--muted); }
.bar { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface2); }
.seg { display: block; min-width: 6px; background: var(--c, var(--gone)); }
.legend { display: flex; gap: 4px 16px; flex-wrap: wrap; margin-top: 10px; }
.leg { background: none; border: 0; padding: 2px 0; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
.ok { --c: var(--ok); } .wait { --c: var(--wait); } .hold { --c: var(--hold); } .no { --c: var(--no); } .gone { --c: var(--gone); }
.notices { margin-bottom: 12px; }
.notices p { font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--hold); border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; }

.tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.tabs .btn { flex: none; white-space: nowrap; margin-bottom: 4px; }
.tab { white-space: nowrap; background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; font-weight: 500; text-align: left; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; min-width: 220px; }

/* decision rows */
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.row.open { border-color: var(--accent); }
.row.gone { opacity: .7; }
.row-h { width: 100%; display: grid; grid-template-columns: 74px minmax(130px, 1.1fr) auto 44px minmax(0, 2.3fr) 14px; gap: 12px; align-items: center; background: none; border: 0; text-align: left; padding: 11px 14px; }
.row.gone .row-h { grid-template-columns: 74px minmax(130px, 1.1fr) auto 1fr; padding: 11px 14px; display: grid; }
.rid { font-weight: 600; white-space: nowrap; }
.rname { display: flex; flex-direction: column; line-height: 1.25; font-weight: 500; }
.rname small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.rout { display: flex; align-items: center; gap: 8px; }
.was { font-size: 12px; color: var(--muted); }
.score { font-family: var(--display); font-weight: 800; font-size: 18px; text-align: right; }
.score.off { color: var(--muted); font-weight: 400; }
.rwhy { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.open .rwhy { white-space: normal; }
.chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); justify-self: center; transition: transform .15s; }
.row.open .chev { transform: rotate(-135deg); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); white-space: nowrap; }
.pill.sm { padding: 0 8px; font-size: 12px; }

.detail { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 26px; padding: 6px 18px 20px; border-top: 1px solid var(--line); }
.detail h4 { font-family: var(--display); font-size: 15px; margin: 16px 0 6px; }
.detail h4:first-child { margin-top: 12px; }
.dcol p { font-size: 14.5px; }
.cond { background: var(--surface2); border-radius: 6px; padding: 8px 10px; font-size: 13.5px !important; }
.tl { list-style: none; margin: 8px 0; padding: 0; }
.tl li { border-left: 2px solid var(--line); padding: 0 0 12px 14px; position: relative; font-size: 14.5px; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl li b { font-weight: 600; margin-right: 6px; }
.tl li span { display: block; color: var(--muted); font-size: 13.5px; }
.bp { margin-bottom: 9px; }
.bp-l { display: flex; justify-content: space-between; font-size: 13.5px; }
.bp-l small { color: var(--muted); font-weight: 400; }
.track { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin: 3px 0 2px; border: 1px solid var(--line); }
.track i { display: block; height: 100%; background: var(--accent); }
.flags { list-style: none; padding: 0; margin: 0; }
.fl { display: flex; gap: 9px; font-size: 13.5px; margin-bottom: 6px; }
.fdot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--gone); }
.fl.hold .fdot { background: var(--hold); } .fl.reject .fdot { background: var(--no); } .fl.soft .fdot { background: var(--wait); } .fl.clean .fdot { background: var(--ok); }
.seg-g { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.seg-b { background: var(--surface); border: 0; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.seg-b.on { background: var(--accent); color: var(--accent-ink); }
.letter { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; line-height: 1.6; margin-bottom: 8px; }
.letter[lang="hi"] { font-family: 'Noto Sans Devanagari', 'Nirmala UI', Mangal, 'Kohinoor Devanagari', 'Devanagari Sangam MN', var(--body); }
.letter[lang="kn"] { font-family: 'Noto Sans Kannada', 'Nirmala UI', Tunga, 'Kannada Sangam MN', var(--body); }
.rec { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; font-size: 13.5px; margin: 0; }
.rec dt { color: var(--muted); } .rec dd { margin: 0; }

/* pin board */
.b-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.b-legend span { display: inline-flex; align-items: center; gap: 7px; }
.b-legend .tile { width: 24px; height: 16px; padding: 0; border-radius: 4px; }
.board { display: flex; flex-direction: column; gap: 14px; }
.terr { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; margin-bottom: 0; }
.terr header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.terr h3 { font-family: var(--display); font-size: 17px; font-weight: 800; }
.slots { display: flex; align-items: center; gap: 8px; }
.dots { display: inline-flex; gap: 4px; }
.sdot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ok); display: block; }
.sdot.on { background: var(--ok); }
.slots small { color: var(--muted); font-size: 12.5px; }
.tiles, .outside { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; width: 104px; height: 64px; padding: 7px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; }
.tile b { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--muted); letter-spacing: 0.01em; }
.tile b u { text-decoration: none; font-weight: 800; color: var(--ink); }
.tile span { font-size: 12.5px; font-weight: 600; }
.tile em { position: absolute; bottom: 7px; right: 9px; font-style: normal; font-size: 12px; font-weight: 600; color: var(--wait); }
.t-open span { color: var(--muted); font-weight: 400; }
.t-store { border-style: dashed; background: repeating-linear-gradient(135deg, var(--surface2) 0 6px, var(--surface) 6px 12px); }
.t-store span { color: var(--muted); }
.t-ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, var(--surface)); } .t-ok span { color: var(--ok); }
.t-wait { border-color: var(--wait); background: color-mix(in srgb, var(--wait) 11%, var(--surface)); } .t-wait span { color: var(--wait); }
.t-hold { border-color: var(--hold); border-style: dotted; background: color-mix(in srgb, var(--hold) 9%, var(--surface)); } .t-hold span { color: var(--hold); }
button.tile:hover { transform: translateY(-1px); }

/* assumptions */
.assume .a-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.assume section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.assume section.wide { grid-column: 1 / -1; }
.assume h4 { font-family: var(--display); font-size: 15px; margin-bottom: 8px; }
.assume h4.mt { margin: 22px 0 8px; }
.a-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px; }
.fld { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.fld input { width: 74px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); text-align: right; }
.w-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 22px; }
.rules { padding-left: 20px; font-size: 14px; color: var(--muted); }
.rules li { margin-bottom: 4px; }

/* ask panel */
.ask { position: sticky; top: calc(66px + env(safe-area-inset-top, 0px)); }
.ask-in { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 92px); }
.ask-in h2 { font-family: var(--display); font-size: 19px; font-weight: 800; }
.log { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 96px; flex: 1 1 auto; padding-right: 2px; }
.msg { border-radius: 10px; padding: 9px 12px; font-size: 14px; max-width: 100%; }
.msg p { font-size: 14px; margin-bottom: 6px; } .msg p:last-child { margin-bottom: 0; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); max-width: 88%; }
.msg.desk { background: var(--surface2); border: 1px solid var(--line); }
.msg .nx { color: var(--muted); }
.msg .ap { font-weight: 500; }
.diff { list-style: none; padding: 0; margin: 4px 0 8px; font-size: 13.5px; }
.diff li { padding: 3px 0; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
.ask-tools { display: flex; justify-content: space-between; font-size: 13px; }
.cmp { border-collapse: collapse; font-size: 13.5px; width: 100%; }
.cmp th, .cmp td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp .tot td { font-weight: 600; }

@media (max-width: 1060px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .ask { position: static; }
  body:has(.workspace) .top .jump-ask { display: inline-flex; }
  .ask-in { max-height: none; }
  .log { max-height: 420px; }
  .detail { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
@media (max-width: 720px) {
  .row-h { grid-template-columns: auto minmax(0, 1fr) auto 14px; row-gap: 4px; }
  .brand small { display: none; }
  .row-h .score { display: none; }
  .row-h .rwhy { grid-column: 1 / -1; white-space: normal; }
  .rout { grid-column: 3; }
  .assume .a-grid { grid-template-columns: minmax(0, 1fr); }
  .w-grid { grid-template-columns: minmax(0, 1fr); }
  .top .actions { margin-left: 0; width: 100%; }
  .tabs { flex-wrap: wrap; } .tabs .grow { display: none; }
  .top { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } button.tile:hover { transform: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2.5" fill="var(--accent)"/><rect x="15" y="2" width="9" height="9" rx="2.5" fill="none" stroke="var(--muted)" stroke-width="1.8"/><rect x="2" y="15" width="9" height="9" rx="2.5" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="3 2"/><rect x="15" y="15" width="9" height="9" rx="2.5" fill="none" stroke="var(--muted)" stroke-width="1.8"/></svg>
    Territory Desk <small>Franchise partner decisions</small>
  </div>
  <div class="actions">
    <a class="btn jump-ask" href="#ask">Ask a question</a>
    <button class="btn" data-act="sample">Load sample data</button>
    <label class="btn primary">Upload workbook<input type="file" id="file" accept=".xlsx,.xls" hidden></label>
  </div>
</header>
<div id="err" role="alert" hidden></div>
<main id="app"></main>

<!-- SheetJS is served from this site (vendor/, copied by build.js) so a CDN outage cannot break uploads -->
<script src="xlsx.full.min.js"></script>
/*SCRIPTS*/
</body>
</html>
