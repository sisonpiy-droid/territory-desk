function territoryCard(tid) {
  var t = S.ters.filter(function (x) { return x.id === tid; })[0]; if (!t) return '<p>Territory not found.</p>';
  var run = S.run, appr = S.apps.filter(function (a) { return !a.withdrawn && t.pins.indexOf(a.pin) >= 0 && run.res[a.id].outcome === 'Approve'; });
  var wl = S.apps.filter(function (a) { return !a.withdrawn && t.pins.indexOf(a.pin) >= 0 && run.res[a.id].outcome === 'Waitlist'; });
  var locked = t.pins.filter(function (p) { return run.ctx.storeByPin[p]; });
  var free = E.freePins(run, t.city).filter(function (p) { return p.ter === tid; });
  return '<p><b>' + esc(t.id) + '</b> ' + esc(t.city) + ', ' + esc(t.tier) + ', ' + esc(t.priority) + ' priority. ' + appr.length + ' of ' + t.slots + ' slots filled.</p>' +
    '<p>Approved: ' + (appr.map(function (a) { return esc(a.id) + ' (' + esc(a.pin) + ')'; }).join(', ') || 'none') + '.</p>' +
    '<p>Waitlisted: ' + (wl.map(function (a) { return esc(a.id); }).join(', ') || 'none') + '.</p>' +
    '<p>Locked by existing stores: ' + (locked.join(', ') || 'none') + '. Open pins: ' + (free.map(function (p) { return p.pin; }).join(', ') || 'none') + '.</p>';
}

function listCard(o) {
  var items = S.apps.filter(function (a) { return !a.withdrawn && S.run.res[a.id].outcome === o; });
  if (!items.length) return '<p>No applications are currently ' + { Approve: 'approved', Waitlist: 'waitlisted', Hold: 'on hold', Reject: 'rejected' }[o] + '.</p>';
  var lbl = { Approve: 'approved', Waitlist: 'waitlisted', Hold: 'on hold', Reject: 'not taken forward' }[o];
  return '<p>' + items.length + ' ' + lbl + ':</p><ul class="diff">' + items.map(function (a) {
    var r = S.run.res[a.id], x = E.explain(r, a, { cfg: S.cfg, run: S.run });
    return '<li><button class="link" data-act="open-app" data-v="' + esc(a.id) + '"><b>' + esc(a.id) + '</b> ' + esc(a.name) + '</button> ' + esc(x.headline) + '</li>';
  }).join('') + '</ul>';
}

function summaryCard() {
  var c = { Approve: 0, Waitlist: 0, Hold: 0, Reject: 0 }, reasons = {};
  S.apps.forEach(function (a) { if (a.withdrawn) return; var r = S.run.res[a.id]; c[r.outcome]++; if (r.outcome === 'Hold') r.issues.filter(function (i) { return i.level === 'hold'; }).forEach(function (i) { reasons[i.title] = (reasons[i.title] || 0) + 1; }); });
  var top = Object.keys(reasons).sort(function (a, b) { return reasons[b] - reasons[a]; }).slice(0, 3);
  var full = S.ters.filter(function (t) { return (S.run.approvedByTer[t.id] || 0) >= t.slots; }).map(function (t) { return t.id; });
  return '<p>' + c.Approve + ' approved, ' + c.Waitlist + ' waitlisted, ' + c.Hold + ' on hold, ' + c.Reject + ' not taken forward.</p>' +
    (top.length ? '<p>Most common reasons for a hold: ' + top.map(function (k) { return k.toLowerCase() + ' (' + reasons[k] + ')'; }).join('; ') + '.</p>' : '') +
    (full.length ? '<p>Territories with every slot filled: ' + full.join(', ') + '.</p>' : '');
}

function helpCard() {
  return '<p>I can answer in plain language, and I can take new information:</p><ul class="diff"><li>Why is APP-007 on hold?</li><li>What would it take for APP-010?</li><li>Who is competing with APP-003?</li><li>Compare APP-001 and APP-002</li><li>Tell me about TER-01</li><li>List all holds</li><li>APP-012 has found a 400 sq ft ground-floor shop</li><li>APP-010 can now invest 30 lakh</li><li>APP-004 withdrew</li><li>TER-02 has one more slot</li></ul>';
}

function answer(text) {
  var low = text.toLowerCase().trim();
  if (!low) return '';
  for (var xi = 0; xi < window.DeskExt.answerers.length; xi++) {
    var xr = window.DeskExt.answerers[xi](text, window.__desk); if (xr) return xr;
  }
  if (/^(undo|revert)\b/.test(low) || /\bundo (that|the last|last)/.test(low)) { return doUndo(true); }
  var ids = findIds(text), tids = findTers(text);
  var infoCue = /\b(now|found|just|updated?|changed?|secured|signed|withdr\w*|dropped|dropping|instead|since)\b/.test(low);
  var questionish = /^(why|how|what|who|which|list|show|explain|compare|tell|give|is|are|can|does|do|summar)/.test(low) && !/\bwhat if\b/.test(low) && !infoCue;
  if (/\b(why|how come|explain|reason|what happened)\b/.test(low) && !infoCue) questionish = true;

  if (/\b(help|what can you do|how do i use)\b/.test(low)) return helpCard();
  if (/\b(summary|summari[sz]e|overview|how are we doing|big picture)\b/.test(low)) return summaryCard();
  var lm = low.match(/\b(list|show|which)\b[^.?]*\b(approved|waitlisted|waitlist|on hold|holds|hold|rejected|reject|approvals)\b/);
  if (lm && !ids.length) { var w = lm[2]; return listCard(/approv/.test(w) ? 'Approve' : /wait/.test(w) ? 'Waitlist' : /hold/.test(w) ? 'Hold' : 'Reject'); }
  if (/\bhow many\b/.test(low) && !ids.length) return summaryCard();

  if (!questionish) {
    // new information about an applicant
    if (ids.length >= 1 && !tids.length) {
      var a = getApp(ids[0]);
      if (a) {
        var f = parseFields(low);
        var keys = Object.keys(f);
        if (keys.length) {
          pushUndo();
          var did = applyAppFields(a, f);
          var diff = recompute();
          render();
          var note = '';
          if (f.spaceFound && a.sizeAssumed) note = '<p class="nx">No size was given, so I assumed it meets the ' + S.cfg.minSpace + ' sq ft minimum and made confirming it a condition of approval.</p>';
          if (f.spaceFound && a.floor === 'Not known') note += '<p class="nx">The floor was not stated, so confirming it is a condition too.</p>';
          return '<p class="ap">Recorded for <b>' + esc(a.id) + '</b> ' + esc(a.name) + ': ' + esc(did.join(', ') || 'update') + '.' + ((f.spaceFound || f.size !== undefined || f.floor !== undefined || f.pin) ? ' Older free-text notes about the space no longer count.' : '') + '</p>' + note +
            '<p><b>What changed</b></p>' + diffHtml(diff) + explainCard(a.id);
        }
      }
    }
    if (tids.length) {
      var t = S.ters.filter(function (x) { return x.id === tids[0]; })[0], tf = parseTerritoryChange(low);
      if (t && (tf.slots !== undefined || tf.priority)) {
        pushUndo();
        var d2 = [];
        if (tf.slots !== undefined) { var nv = tf.add ? t.slots + tf.slots : tf.slots; d2.push('open slots ' + t.slots + ' to ' + nv); t.slots = nv; }
        if (tf.priority) { d2.push('priority ' + t.priority + ' to ' + tf.priority); t.priority = tf.priority; }
        var diff2 = recompute(); render();
        return '<p class="ap">Updated <b>' + esc(t.id) + '</b>: ' + esc(d2.join(', ')) + '.</p><p><b>What changed</b></p>' + diffHtml(diff2) + territoryCard(t.id);
      }
    }
  }
  // what if X ... applies as new information too
  if (/\bwhat if\b/.test(low) && ids.length) {
    var a2 = getApp(ids[0]), f2 = parseFields(low);
    if (a2 && Object.keys(f2).length) { pushUndo(); var did2 = applyAppFields(a2, f2), df = recompute(); render();
      return '<p class="ap">Applied as a scenario for <b>' + esc(a2.id) + '</b>: ' + esc(did2.join(', ')) + '. Use Undo to go back.</p><p><b>What changed</b></p>' + diffHtml(df) + explainCard(a2.id); }
  }

  if (/\bcompar/.test(low) && ids.length >= 2) return compareCard(ids[0], ids[1]);
  if (tids.length && !ids.length) return territoryCard(tids[0]);
  if (ids.length) {
    if (/(compet|rival|against|ahead of|beat|rank|behind)/.test(low)) return competitorsCard(ids[0]);
    return explainCard(ids[0]);
  }
  return '<p>I did not catch which application or territory you mean. Mention an ID like APP-007 or TER-02.</p>' + helpCard();
}

function doUndo(fromChat) {
  var u = S.undo.pop();
  if (!u) return fromChat ? '<p>Nothing to undo.</p>' : '';
  S.apps = u.apps; S.ters = u.ters; S.cfg = u.cfg;
  var c0 = S.cause; S.cause = { kind: 'Undo', text: 'Last change undone' };
  var diff = recompute(); S.cause = c0; render();
  return fromChat ? '<p class="ap">Last change undone.</p>' + diffHtml(diff) : '';
}

function ask(text) {
  text = String(text || '').trim(); if (!text) return;
  S.askLog.push({ who: 'me', text: text });
  var html;
  S.cause = { kind: /\bwhat if\b/i.test(text) ? 'What-if' : 'New information', text: text };
  try { html = answer(text); } catch (e) { html = '<p>Something went wrong reading that: ' + esc(e.message) + '</p>'; }
  S.cause = null;
  S.askLog.push({ who: 'desk', html: html });
  var asideEl = $('#ask'); if (asideEl) asideEl.innerHTML = askHtml();
  scrollAskToEnd();
  var inp = $('#askin'); if (inp) inp.focus();
}

/* ------------------------------------------------------------------ */
/* Workbook reading and writing                                        */
/* ------------------------------------------------------------------ */
function handleFile(file) {
  if (!file) return;
  var rd = new FileReader();
  rd.onerror = function () { showError('The file could not be read.'); };
  rd.onload = function (ev) {
    try {
      var wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
      var sheets = {};
      wb.SheetNames.forEach(function (n) { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }); });
      var pk = E.pickSheets(sheets);
      if (!E.parseApplications(pk.apps).length) throw new Error('The Applications sheet has a header row but no applications under it.');
      if (!E.parseTerritories(pk.ters).length) throw new Error('The Territories sheet has a header row but no territories under it.');
      load(pk.apps, pk.ters, file.name);
      hideError();
    } catch (e) { showError(e.message || String(e)); }
  };
  rd.readAsArrayBuffer(file);
}
function showError(m) { var b = $('#err'); b.textContent = m; b.hidden = false; }
function hideError() { var b = $('#err'); b.hidden = true; }

function downloadSample() {
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(SD.appsAoA), 'Applications');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(SD.tersAoA), 'Territories');
  var st = [['Store ID', 'City', 'Pin code', 'Opened (year)']].concat(E.STORES.map(function (s) { return [s.id, s.city, +s.pin, s.year]; }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Existing stores - fixed'], st[0]].concat(st.slice(1))), 'Existing stores');
  XLSX.writeFile(wb, 'territory-desk-sample.xlsx');
}

function exportDecisions() {
  if (!S.run) return;
  var rows = [['Application ID', 'Applicant', 'City', 'Pin code', 'Territory', 'Outcome', 'Score', 'Rank on pin', 'Why', 'Next step or what would change this', 'Conditions', 'Training language', 'Training track', 'Mentor store', 'Realistic opening (weeks)', 'Message to applicant']];
  S.apps.forEach(function (a) {
    if (a.withdrawn) { rows.push([a.id, a.name, a.city, a.pin, '', 'Withdrawn', '', '', 'Withdrawn by applicant', '', '', '', '', '', '', '']); return; }
    var r = S.run.res[a.id], x = E.explain(r, a, { cfg: S.cfg, run: S.run }), p = r.outcome === 'Approve' ? E.onboardingPlan(r, a, { cfg: S.cfg, run: S.run }) : null;
    rows.push([a.id, a.name, a.city, a.pin, r.ter ? r.ter.id : '', r.outcome, (r.outcome === 'Approve' || r.outcome === 'Waitlist') ? r.score : '', r.rankPin ? r.rankPin + ' of ' + r.pinN : '',
      [x.headline].concat(x.lines).join(' '), x.next.join(' '), r.conditions && r.outcome === 'Approve' ? r.conditions.join('; ') : '', a.lang || 'English',
      p ? p.track : '', p ? p.mentor.id : '', p ? p.openWeeks : '', E.letter(r, a, a.lang || 'English', S.cfg)]);
  });
  var wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [10, 18, 16, 9, 9, 9, 6, 9, 60, 60, 40, 10, 20, 8, 10, 60].map(function (w) { return { wch: w }; });
  XLSX.utils.book_append_sheet(wb, ws, 'Decisions');
  var brows = [['Territory', 'City', 'Tier', 'Priority', 'Open slots', 'Slots filled', 'Pin code', 'Status']];
  S.ters.forEach(function (t) { t.pins.forEach(function (p) {
    var st = S.run.ctx.storeByPin[p], ap = S.run.approvedPins[p];
    brows.push([t.id, t.city, t.tier, t.priority, t.slots, Math.min(t.slots, S.run.approvedByTer[t.id] || 0), p, st ? 'Locked: ' + st.id : ap ? 'Approved: ' + ap : 'Open']);
  }); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(brows), 'Pin board');
  window.DeskExt.exportSheets.forEach(function (fn) { try { var sh = fn(S); if (sh) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sh.rows), sh.name); } catch (e) { console.error(e); } });
  XLSX.writeFile(wb, 'franchise-decisions.xlsx');
}

/* ------------------------------------------------------------------ */
/* Events                                                              */
/* ------------------------------------------------------------------ */
function refreshBody() { var b = $('#tabbody'); if (b) b.innerHTML = tabBody(); }
function setPath(obj, path, val) { var p = path.split('.'), o = obj; for (var i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = val; }

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
  switch (act) {
    case 'sample': load(SD.appsAoA, SD.tersAoA, 'sample data'); break;
    case 'dl-sample': downloadSample(); break;
    case 'export': exportDecisions(); break;
    case 'tab': S.tab = v; render(); break;
    case 'clear-ids': S.filterIds = null; refreshBody(); break;
    case 'filter': S.filterIds = null; S.filter = v; S.tab = 'decisions'; render(); break;
    case 'toggle': S.open[v] = !S.open[v]; refreshBody(); break;
    case 'lang': S.letterLang[el.getAttribute('data-id')] = v; refreshBody(); break;
    case 'copy': {
      var a = getApp(el.getAttribute('data-id')), r = S.run.res[a.id];
      var txt = E.letter(r, a, S.letterLang[a.id] || a.lang || 'English', S.cfg);
      var done = function () { el.textContent = 'Copied'; setTimeout(function () { el.textContent = 'Copy message'; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done);
      else { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} document.body.removeChild(ta); done(); }
      break; }
    case 'pin': S.filterIds = null; S.tab = 'decisions'; S.filter = 'all'; S.q = v; render(); break;
    case 'open-app': S.filterIds = null; S.tab = 'decisions'; S.filter = 'all'; S.q = ''; S.open[v] = true; render();
      var row = document.getElementById('row-' + v); if (row) row.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'ask': { var i = $('#askin'); ask(i.value); break; }
    case 'sugg': ask(v); break;
    case 'undo': doUndo(false); break;
    case 'reset-data': if (S.run && S.initial) { pushUndo(); S.apps = E.clone(S.initial.apps); S.ters = E.clone(S.initial.ters); S.cause = { kind: 'Restore', text: 'Uploaded data restored' }; recompute(); S.cause = null; render(); } break;
    case 'reset-cfg': pushUndo(); S.cfg = E.clone(E.DEFAULT_CFG); S.cause = { kind: 'Assumption', text: 'Default assumptions restored' }; recompute(); S.cause = null; render(); break;
    case 'drop-example-app': S.apps = S.apps.filter(function (a) { return !a.templateExample; }); S.notices = S.notices.filter(function (n) { return n.indexOf('drop-example-app') < 0; }); recompute(); render(); break;
    case 'drop-example-ter': S.ters = S.ters.filter(function (t) { return !t.templateExample; }); S.notices = S.notices.filter(function (n) { return n.indexOf('drop-example-ter') < 0; }); recompute(); render(); break;
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'askin') { e.preventDefault(); ask(e.target.value); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; var rows = $('.rows'); var cur = e.target.selectionStart; refreshBody(); var q2 = $('#q'); if (q2) { q2.focus(); q2.setSelectionRange(cur, cur); } }
});
document.addEventListener('change', function (e) {
  var p = e.target.getAttribute && e.target.getAttribute('data-cfg');
  if (p) {
    var val = parseFloat(e.target.value); if (isNaN(val)) return;
    if (p === 'rejectRatio') val = val / 100;
    pushUndo(); setPath(S.cfg, p, val);
    S.cause = { kind: 'Assumption', text: p + ' set to ' + e.target.value };
    var diff = recompute(); S.cause = null; render();
    S.tab = 'assume'; render();
    S.askLog.push({ who: 'desk', html: '<p class="ap">Assumption changed (' + esc(p) + ' = ' + esc(e.target.value) + ').</p><p><b>What changed</b></p>' + diffHtml(diff) });
    var asideEl = $('#ask'); if (asideEl) asideEl.innerHTML = askHtml(); scrollAskToEnd();
  }
  if (e.target.id === 'file' || e.target.id === 'file2') handleFile(e.target.files[0]);
});
['dragover', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) {
  e.preventDefault();
  if (ev === 'drop' && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
}); });

render();
window.__desk = { S: S, E: E, ask: ask, load: load, rerender: render, recompute: recompute, getApp: getApp, esc: esc, pill: pill, pushUndo: pushUndo, getRun: function () { return S.run; },
  // used by src/ext/understand.js to read follow-ups more broadly and apply several changes at once
  answer: answer, findIds: findIds, findTers: findTers, parseFields: parseFields, parseTerritoryChange: parseTerritoryChange,
  applyAppFields: applyAppFields, diffHtml: diffHtml, explainCard: explainCard };
})();

</script>
<script>
/* ext\confidence.js */
// Confidence badge on every decision, the fragile-decisions list, and side-by-side scenario comparison (Scenarios tab).
// Logic lives in src/modules/whatif.js.
(function () {
'use strict';
var D = window.__desk, S = D.S, E = D.E, esc = D.esc, pill = D.pill, W = window.DeskWhatIf;
var LBL = { high: 'High', medium: 'Medium', low: 'Low' };
var cache = { run: null };
var V = { changes: [] };

function calc() {
  if (cache.run !== S.run) { cache.run = S.run; cache.frag = W.fragile(S); cache.conf = W.confidence(S, cache.frag); }
  return cache;
}
function appLink(id) { return '<button class="link" data-act="open-app" data-v="' + esc(id) + '">' + esc(id) + '</button>'; }

/* ---------- badge and detail ---------- */
window.DeskExt.rowBadges.push(function (a) {
  var c = calc().conf[a.id]; if (!c) return '';
  return '<span class="conf c-' + c.level + '" title="Confidence: ' + esc(LBL[c.level] + '. ' + c.why.join('. ')) + '"><i></i>' + LBL[c.level] + '</span>';
});
window.DeskExt.afterDetail.push(function (a) {
  var c = calc().conf[a.id]; if (!c) return '';
  return '<h4>Confidence: ' + LBL[c.level].toLowerCase() + '</h4><ul class="trig">' + c.why.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
});

/* ---------- Scenarios tab ---------- */
function options() {
  return W.THRESHOLDS.map(function (t) { return ['cfg:' + t.path, t.label + ' (' + t.unit + ')']; })
    .concat(S.ters.map(function (t) { return ['slots:' + t.id, 'Open slots in ' + t.id + ' ' + t.city]; }));
}
function current(key) {
  var k = key.split(':');
  if (k[0] === 'slots') return S.ters.filter(function (t) { return t.id === k[1]; })[0].slots;
  var v = W.get(S.cfg, k[1]); return k[1] === 'rejectRatio' ? Math.round(v * 100) : v;
}
function toChanges() {
  return V.changes.map(function (c) {
    var k = c.key.split(':');
    return k[0] === 'slots' ? { kind: 'slots', ter: k[1], value: c.value } : { kind: 'cfg', path: k[1], value: k[1] === 'rejectRatio' ? c.value / 100 : c.value };
  });
}
function describe() {
  var o = {}; options().forEach(function (x) { o[x[0]] = x[1]; });
  return V.changes.map(function (c) { return o[c.key].replace(/ \(.*\)$/, '') + ' ' + current(c.key) + ' to ' + c.value; }).join('; ');
}
function preset(kind) {
  if (kind === 'stricter' || kind === 'looser') {
    var f = kind === 'stricter' ? 1 + W.NUDGE : 1 - W.NUDGE;
    V.changes = W.nudgeAll(S, f).map(function (c) { var v = c.path === 'rejectRatio' ? Math.round(c.value * 100) : Math.round(c.value * 10) / 10; return { key: 'cfg:' + c.path, value: v }; });
  } else {
    var over = window.DeskOps ? window.DeskOps.territoryHealth(S).filter(function (t) { return t.flags.some(function (f) { return f.k === 'over'; }); }) : [];
    V.changes = over.map(function (t) { return { key: 'slots:' + t.id, value: t.slots + 1 }; });
  }
}

function scenHtml() {
  var c = calc(), conf = c.conf, ids = Object.keys(conf);
  var cnt = { high: [], medium: [], low: [] }; ids.forEach(function (id) { cnt[conf[id].level].push(id); });
  var fr = Object.keys(c.frag);
  var tiles = ['high', 'medium', 'low'].map(function (l) {
    return '<button class="ctile c-' + l + '" data-act="conf-ids" data-v="' + l + '" data-ids="' + cnt[l].join(',') + '"><b>' + cnt[l].length + '</b><span><i></i>' + LBL[l] + ' confidence</span></button>';
  }).join('');
  var frag = fr.length ? '<ul class="fraglist">' + fr.map(function (id) {
    var a = D.getApp(id);
    return '<li>' + appLink(id) + ' ' + esc(a.name) + ' ' + pill(S.run.res[id].outcome, true) + '<ul>' + c.frag[id].map(function (f) {
      return '<li>Becomes ' + pill(f.now, true) + ' if ' + esc(f.label.charAt(0).toLowerCase() + f.label.slice(1)) + ' ' + (f.up ? 'rises' : 'falls') + ' from ' + esc(f.from) + ' to ' + esc(f.to) + '</li>';
    }).join('') + '</ul></li>';
  }).join('') + '</ul>' : '<p class="muted">No decision changes when any one threshold moves 10% either way.</p>';

  var opts = options();
  var rows = V.changes.map(function (ch, i) {
    return '<div class="sc-row"><select data-sc-key="' + i + '" aria-label="What to change">' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === ch.key ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>' +
      '<span class="muted sm">now ' + esc(current(ch.key)) + ', try</span><input type="number" step="any" data-sc-val="' + i + '" value="' + esc(ch.value) + '" aria-label="New value">' +
      '<button class="link sm" data-act="sc-del" data-v="' + i + '">Remove</button></div>';
  }).join('');
  var result = '';
  if (V.changes.length) {
    var sc = W.scenario(S, toChanges());
    var tbl = ['Approve', 'Waitlist', 'Hold', 'Reject'].map(function (o) {
      var d = sc.after[o] - sc.before[o];
      return '<tr><td>' + pill(o, true) + '</td><td>' + sc.before[o] + '</td><td>' + sc.after[o] + '</td><td class="' + (o !== 'Approve' ? '' : d > 0 ? 'up' : d < 0 ? 'down' : '') + '">' + (d > 0 ? '+' : '') + (d || '–') + '</td></tr>';
    }).join('');
    result = '<div class="sc-out"><table class="cmp"><thead><tr><th>Outcome</th><th>Now</th><th>Scenario</th><th>Change</th></tr></thead><tbody>' + tbl + '</tbody></table>' +
      '<div><h4>Who changes (' + sc.changed.length + ')</h4>' + (sc.changed.length ? '<ul class="diff">' + sc.changed.map(function (x) { return '<li>' + appLink(x.id) + ' ' + esc(x.name) + ' ' + pill(x.from, true) + ' to ' + pill(x.to, true) + '</li>'; }).join('') + '</ul>' : '<p class="muted">Nobody: every decision holds.</p>') +
      '<button class="btn sm primary" data-act="sc-apply">Apply this scenario</button> <span class="muted sm">It goes in the decision log; Undo reverses it.</span></div></div>';
  }
  return '<div class="scen"><h4>How sure is each decision?</h4><p class="muted sm">High: ' + W.CONF.high + '+ points clear of the next rival, or decided on facts in the form. Medium: ' + W.CONF.medium + ' to ' + W.CONF.high + ' points, or a data flag. Low: under ' + W.CONF.medium + ' points, or fragile. Click a tile to see those applications.</p>' +
    '<div class="ctiles">' + tiles + '</div>' +
    '<h4 class="mt">Fragile decisions <span class="muted">' + fr.length + '</span></h4><p class="muted sm">Decisions that change if any one threshold moves ' + Math.round(W.NUDGE * 100) + '% either way. A person should look at these before anything is signed.</p>' + frag +
    '<h4 class="mt">Compare a scenario</h4><p class="muted sm">Change a threshold or add slots and see, side by side, how many decisions move and whose. Nothing changes until you apply it.</p>' +
    '<div class="sc-pre"><button class="btn sm" data-act="sc-pre" data-v="stricter">Every threshold 10% stricter</button><button class="btn sm" data-act="sc-pre" data-v="looser">Every threshold 10% looser</button><button class="btn sm" data-act="sc-pre" data-v="slots">One more slot where oversubscribed</button></div>' +
    rows + '<button class="link sm" data-act="sc-add">' + (V.changes.length ? 'Add another change' : 'Add a change') + '</button>' + result + '</div>';
}
window.DeskExt.tabs.push({ id: 'scen', label: 'Scenarios', render: scenHtml });

/* ---------- Ask the desk ---------- */
window.DeskExt.answerers.push(function (text) {
  var low = text.toLowerCase();
  if (!/(fragile|borderline|close call|confiden|how sure|on the edge|knife.edge)/.test(low)) return null;
  var c = calc(), m = text.match(/\bapp[-\s_]?0*(\d{1,4})\b/i);
  if (m) {
    var n = parseInt(m[1], 10), a = S.apps.filter(function (x) { return parseInt(x.id.replace(/#.*$/, '').replace(/\D/g, ''), 10) === n; })[0];
    if (!a || !c.conf[a.id]) return null;
    var k = c.conf[a.id];
    return '<p><b>' + esc(a.id) + '</b> ' + esc(a.name) + ' ' + pill(S.run.res[a.id].outcome) + ': ' + LBL[k.level].toLowerCase() + ' confidence.</p><ul class="diff">' + k.why.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
  }
  var fr = Object.keys(c.frag), lowIds = Object.keys(c.conf).filter(function (id) { return c.conf[id].level === 'low'; });
  return '<p>' + lowIds.length + ' decision' + (lowIds.length === 1 ? ' is' : 's are') + ' low confidence; ' + fr.length + ' would flip if one threshold moved 10%:</p><ul class="diff">' +
    fr.map(function (id) { var f = c.frag[id][0]; return '<li>' + appLink(id) + ' ' + pill(S.run.res[id].outcome, true) + ' to ' + pill(f.now, true) + ' if ' + esc(f.label.charAt(0).toLowerCase() + f.label.slice(1)) + ' goes ' + esc(f.from) + ' to ' + esc(f.to) + '</li>'; }).join('') +
    '</ul><button class="link" data-act="tab" data-v="scen">Open Scenarios</button>';
});

/* ---------- events ---------- */
function body() { var b = document.getElementById('tabbody'); if (b && S.tab === 'scen') b.innerHTML = scenHtml(); }
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-act^="sc-"],[data-act="conf-ids"]'); if (!el) return;
  var act = el.getAttribute('data-act');
  if (act === 'sc-add') { var k = options()[0][0]; V.changes.push({ key: k, value: current(k) }); body(); }
  else if (act === 'sc-del') { V.changes.splice(+el.getAttribute('data-v'), 1); body(); }
  else if (act === 'sc-pre') { preset(el.getAttribute('data-v')); body(); }
  else if (act === 'sc-apply') {
    var sc = W.scenario(S, toChanges()), what = describe();
    D.pushUndo(); S.cfg = sc.cfg; S.ters = sc.ters;
    S.cause = { kind: 'What-if', text: 'Scenario applied: ' + what };
    var diff = D.recompute(); S.cause = null; V.changes = [];
    S.askLog.push({ who: 'desk', html: '<p class="ap">Scenario applied: ' + esc(what) + '.</p>' + (diff.length ? '<ul class="diff">' + diff.map(function (d) { return '<li>' + appLink(d.id) + ' ' + pill(d.from, true) + ' to ' + pill(d.to, true) + '</li>'; }).join('') + '</ul>' : '<p class="muted">No decision changed.</p>') });
    D.rerender();
  } else if (act === 'conf-ids') {
    var ids = el.getAttribute('data-ids');
    S.filterIds = ids ? ids.split(',') : []; S.filterLabel = el.getAttribute('data-v') + '-confidence decisions'; S.filter = 'all'; S.q = ''; S.tab = 'decisions';
    D.rerender();
  }
});
document.addEventListener('change', function (e) {
  var t = e.target, i = t.getAttribute && (t.getAttribute('data-sc-key') || t.getAttribute('data-sc-val'));
  if (i == null) return;
  if (t.hasAttribute('data-sc-key')) { V.changes[+i] = { key: t.value, value: current(t.value) }; }
  else { var v = parseFloat(t.value); if (isNaN(v)) return; V.changes[+i].value = v; }
  body();
});

var css = document.createElement('style');
css.textContent = [
  '.conf { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }',
  '.conf i, .ctile i { width: 14px; height: 6px; border-radius: 3px; border: 1px solid currentColor; display: inline-block; background: linear-gradient(90deg, currentColor var(--f), transparent var(--f)); }',
  '.c-high { --f: 100%; } .c-medium { --f: 60%; } .c-low { --f: 25%; }',
  '.conf.c-low { color: var(--no); } .conf.c-medium { color: var(--hold); } .conf.c-high { color: var(--ok); }',
  '.scen h4 { font-family: var(--display); font-size: 15px; } .scen h4.mt { margin: 22px 0 6px; }',
  '.ctiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }',
  '.ctile { display: flex; flex-direction: column; align-items: flex-start; text-align: left; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; }',
  '.ctile:hover { border-color: var(--accent); } .ctile b { font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1.1; }',
  '.ctile span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }',
  '.ctile.c-low b { color: var(--no); } .ctile.c-medium b { color: var(--hold); } .ctile.c-high b { color: var(--ok); }',
  '.fraglist { list-style: none; padding: 0; margin: 6px 0; } .fraglist > li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }',
  '.fraglist ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; }',
  '.sc-pre { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }',
  '.sc-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }',
  '.sc-row select, .sc-row input { border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; background: var(--surface); font-size: 13.5px; }',
  '.sc-row select { max-width: 100%; } .sc-row input { width: 90px; }',
  '.sc-out { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 18px; margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }',
  '.sc-out h4 { margin-bottom: 4px; } .sc-out td.up { color: var(--ok); font-weight: 600; } .sc-out td.down { color: var(--no); font-weight: 600; }',
  '@media (max-width: 720px) { .sc-out { grid-template-columns: minmax(0, 1fr); } .ctiles { grid-template-columns: minmax(0, 1fr); } }'
].join('\n');
document.head.appendChild(css);
})();

</script>
<script>
/* ext\demo.js */
// Guided demo: plays the one-minute video sequence (upload, decisions, one "why", one "what if") the same way every time.
// Start with the "Play demo" button, or open the link with #demo. Esc or Stop ends it.
(function () {
'use strict';
var D = window.__desk, S = D.S, SD = window.SampleData;
var timers = [], bar = null;

function $(s) { return document.querySelector(s); }
function later(ms, fn) { timers.push(setTimeout(fn, ms)); }
function stop() { timers.forEach(clearTimeout); timers = []; hl(null); if (bar) { bar.remove(); bar = null; } }
function hl(sel, block) {
  Array.prototype.forEach.call(document.querySelectorAll('.demo-hl'), function (e) { e.classList.remove('demo-hl'); });
  var el = sel && $(sel); if (!el) return;
  el.classList.add('demo-hl'); el.scrollIntoView({ behavior: 'smooth', block: block || 'center' });
}
function say(n, total, text) {
  if (!bar) {
    bar = document.createElement('div'); bar.className = 'demo-bar'; bar.setAttribute('role', 'status');
    bar.innerHTML = '<span class="demo-step"></span><p></p><button class="btn sm" data-demo="stop">Stop</button>';
    document.body.appendChild(bar);
  }
  bar.querySelector('.demo-step').textContent = n + ' / ' + total;
  bar.querySelector('p').textContent = text;
}
function type(text, ms, done) {
  var i = 0, inp = $('#askin'); if (!inp) return done();
  inp.focus();
  (function tick() { if (!$('#askin')) return; $('#askin').value = text.slice(0, ++i); if (i < text.length) later(ms, tick); else later(400, done); })();
}
function outcomeOf(id) { var r = S.run && S.run.res[id]; return r ? r.outcome : ''; }
function word(o) { return { Approve: 'approved', Waitlist: 'waitlisted', Hold: 'on hold', Reject: 'rejected' }[o] || o; }

function play() {
  stop();
  var N = 9;
  S.run = null; S.open = {}; D.rerender(); window.scrollTo(0, 0);
  say(1, N, 'The expansion team uploads this week\'s Applications and Territories workbook.');
  hl('.drop');

  later(3500, function () {
    D.load(SD.appsAoA, SD.tersAoA, 'this week\'s workbook');
    var c = { Approve: 0, Waitlist: 0, Hold: 0, Reject: 0 };
    Object.keys(S.run.res).forEach(function (id) { c[S.run.res[id].outcome]++; });
    say(2, N, 'Every application is decided in a second: ' + c.Approve + ' approved, ' + c.Waitlist + ' waitlisted, ' + c.Hold + ' on hold, ' + c.Reject + ' rejected. Never two stores in one pin code.');
    hl('.summary');
  });
  later(9500, function () { say(3, N, 'Where applications drop out, and why. Click any step to see who.'); hl('.pipe-card'); });
  later(15500, function () { say(4, N, 'What needs a person today, with each message drafted in the applicant\'s own language.'); hl('.ops-grid .card'); });

  later(21500, function () {
    var appr = S.apps.filter(function (a) { return outcomeOf(a.id) === 'Approve'; })[0];
    if (appr) { S.open[appr.id] = true; D.rerender(); }
    say(5, N, 'Every partner gets the reason, a score, a training plan in their language and a date to sign by.');
    if (appr) hl('#row-' + appr.id, 'start');
  });

  later(29500, function () {
    var ids = S.apps.map(function (a) { return a.id; });
    var hold = ids.filter(function (id) { return outcomeOf(id) === 'Hold'; });
    var fixable = hold.filter(function (id) { var r = S.run.res[id]; return r.ifFixed && r.ifFixed.possible && r.ifFixed.outcome === 'Approve' && r.issues.some(function (i) { return i.code === 'NO_SPACE'; }); });
    var whyId = fixable[0] || hold[0], ifId = fixable[fixable.length - 1] || whyId;
    hl('#ask');
    say(6, N, 'Ask why, in plain language.');
    type('Why is ' + whyId + ' on hold?', 45, function () {
      D.ask($('#askin').value);
      hl('#ask');
      later(6500, function () {
        say(7, N, 'Give it new information and the decision changes.');
        var before = outcomeOf(ifId);
        type(ifId + ' has now found a ground-floor space', 40, function () {
          D.ask($('#askin').value);
          hl('#ask');
          say(7, N, ifId + ' moves from ' + word(before) + ' to ' + word(outcomeOf(ifId)) + '. Every other decision is checked again, and the change is logged.');
          later(8000, function () {
            var r = S.run.res[ifId], tid = r && r.ter ? r.ter.id : '';
            S.tab = 'board'; D.rerender();
            say(8, N, 'The pin board updates' + (tid ? ': ' + tid + ' now has ' + Math.min(r.ter.slots, S.run.approvedByTer[tid] || 0) + ' of ' + r.ter.slots + ' slots filled.' : '.'));
            hl('.board');
            later(6000, function () {
              say(9, N, 'Territory Desk: from first application to an open, trained store, without the spreadsheet chase.');
              hl('.summary');
              later(4500, stop);
            });
          });
        });
      });
    });
  });
}

var btn = document.createElement('button');
btn.className = 'btn'; btn.setAttribute('data-demo', 'play'); btn.textContent = 'Play demo';
var acts = $('.top .actions'); if (acts) acts.insertBefore(btn, acts.firstChild);

document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-demo]'); if (!el) return;
  if (el.getAttribute('data-demo') === 'play') play(); else stop();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && bar) stop(); });
if (location.hash === '#demo') setTimeout(play, 600);
window.__demo = { play: play, stop: stop };

var css = document.createElement('style');
css.textContent = [
  '.demo-hl { outline: 3px solid var(--accent) !important; outline-offset: 4px; border-radius: 12px; transition: outline-color .3s; }',
  '.demo-bar { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; width: min(760px, calc(100vw - 24px));',
  '  display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px 12px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }',
  '.demo-bar p { margin: 0; flex: 1; font-size: 15.5px; line-height: 1.4; font-weight: 500; }',
  '.demo-step { font-family: var(--display); font-weight: 800; font-size: 13px; opacity: .7; white-space: nowrap; }',
  '.demo-bar .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }'
].join('\n');
document.head.appendChild(css);
})();

</script>
<script>
/* ext\followthrough.js */
// Phase 2: overrides with a reason, backward onboarding plans and a stage board, the decision log, re-run triggers.
// Logic lives in engine.js (overrides in allocation), src/modules/plan.js and src/modules/triggers.js.
(function () {
'use strict';
var D = window.__desk, S = D.S, E = D.E, esc = D.esc, pill = D.pill, P = window.DeskPlan, TR = window.DeskTriggers;
var OUTS = ['Approve', 'Waitlist', 'Hold', 'Reject'];
S.log = []; S.stages = {};

function fmt(d) { return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
function fmtT(d) { return d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function appLink(id) { return '<button class="link" data-act="open-app" data-v="' + esc(id) + '">' + esc(id) + '</button>'; }
function short(id) { var a = D.getApp(id), r = S.run.res[id]; return a && r ? E.explain(r, a, { cfg: S.cfg, run: S.run }).short || '' : ''; }
function log(e) { e.at = new Date(); S.log.push(e); }

/* ---------- decision log: every decision, override, what-if and change ---------- */
window.DeskExt.afterRecompute.push(function (diff, first, cause) {
  if (first) {
    S.log = []; S.stages = {}; S.loadedAt = new Date();
    var n = S.apps.filter(function (a) { return !a.withdrawn; }).length;
    log({ kind: 'Upload', text: 'Decided ' + n + ' applications' + (S.label ? ' from ' + S.label : '') });
    S.apps.forEach(function (a) { var r = S.run.res[a.id]; if (r) log({ kind: 'Decision', id: a.id, to: r.outcome, text: short(a.id) }); });
    return;
  }
  log({ kind: cause ? cause.kind : 'Change', text: (cause ? cause.text : 'Data updated') + (diff.length ? '' : ' (no decision changed)') });
  diff.forEach(function (d) { log({ kind: 'Decision', id: d.id, from: d.from, to: d.to, text: d.to === 'Withdrawn' ? 'Withdrawn by applicant' : d.note || short(d.id) }); });
});

/* ---------- overrides ---------- */
function setOverride(id, to, reason) {
  var a = D.getApp(id); if (!a) return '<p>I cannot find ' + esc(id) + ' in this file.</p>';
  D.pushUndo();
  var prev = a.override;
  a.override = to ? { to: to, reason: reason, at: Date.now() } : null;
  S.cause = { kind: 'Override', text: to ? id + ' set to ' + to + ': ' + reason : 'Override removed from ' + id + (prev ? ' (was ' + prev.to + ')' : '') };
  var diff = D.recompute(); S.cause = null;
  var r = S.run.res[id], msg;
  if (to && r.override && !r.override.applied) {
    msg = '<p class="ap"><b>Override refused for ' + esc(id) + '.</b> ' + esc(r.override.refused.charAt(0).toUpperCase() + r.override.refused.slice(1)) + '. The decision stays ' + pill(r.outcome, true) + '. The override is kept on record and takes effect if that changes.</p>';
    log({ kind: 'Override refused', id: id, text: r.override.refused });
  } else msg = '<p class="ap">' + (to ? 'Override recorded for <b>' + esc(id) + '</b>: ' + esc(to) + '. Reason: ' + esc(reason) + '.' : 'Override removed from <b>' + esc(id) + '</b>.') + '</p>';
  msg += diff.length ? '<ul class="diff">' + diff.map(function (d) { return '<li>' + appLink(d.id) + ' ' + (d.from === d.to ? esc(d.note || '') : pill(d.from, true) + ' to ' + pill(d.to, true)) + '</li>'; }).join('') + '</ul>' : '<p class="muted">No decision changed.</p>';
  S.askLog.push({ who: 'desk', html: msg });
  D.rerender();
  return msg;
}

function overrideHtml(a, r) {
  var ov = r.override, opts = OUTS.filter(function (o) { return o !== r.outcome || (ov && ov.applied); });
  var now = ov ? '<p class="ovr-now ' + (ov.applied ? 'on' : 'refused') + '">' + (ov.applied ? 'Override in place: ' + esc(ov.to) + '. Reason: ' + esc(ov.reason) + '.' : 'Override to ' + esc(ov.to) + ' refused: ' + esc(ov.refused) + '.') +
    ' <button class="link" data-act="ovr-clear" data-id="' + esc(a.id) + '">Remove override</button></p>' : '';
  return '<h4>Override this decision</h4>' + now +
    '<div class="ovr"><select data-ovr-to="' + esc(a.id) + '" aria-label="New outcome">' + opts.map(function (o) { return '<option>' + o + '</option>'; }).join('') + '</select>' +
    '<input type="text" data-ovr-why="' + esc(a.id) + '" placeholder="Reason (required)" aria-label="Reason for the override">' +
    '<button class="btn sm" data-act="ovr-set" data-id="' + esc(a.id) + '">Apply override</button></div>' +
    '<p class="muted sm ovr-err" data-ovr-err="' + esc(a.id) + '">An approval by override still respects one store per pin code and the territory\'s open slots.</p>';
}

/* ---------- row detail additions ---------- */
window.DeskExt.afterDetail.push(function (a, r) {
  var out = '';
  if (r.outcome === 'Approve') {
    var p = P.plan(a, r, S.cfg, S.loadedAt || new Date(), S.stages[a.id] || 0, new Date());
    out += '<h4>Plan back from the target</h4><p>Sign by <b>' + fmt(p.latestSign) + '</b> to open on <b>' + fmt(p.open) + '</b>. ' + esc(p.basis) + '</p>' +
      (p.atRisk ? '<p class="risk">At risk: ' + esc(p.risks.join('; ')) + '.</p>' : '') +
      '<p class="muted sm">Stage: ' + esc(P.STAGES[p.stage]) + '. Next: ' + esc(p.next ? p.next.title + ' (' + p.next.owner + ', due ' + fmt(p.next.due) + ')' : 'none') + '. <button class="link" data-act="tab" data-v="onboard">Open the stage board</button></p>';
  }
  var t = TR.triggers(S)[a.id];
  if (t && t.events.length) out += '<h4>Decide again when</h4><ul class="trig">' + t.events.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' + (t.then ? '<p class="muted sm">Then: ' + esc(t.then) + '.</p>' : '');
  return out + overrideHtml(a, r);
});

/* ---------- Onboarding tab: stage board and backward plans ---------- */
function onboardHtml() {
  var today = new Date(), ps = P.plans(S, today);
  if (!ps.length) return '<p class="muted pad">No approved partners yet.</p>';
  var risk = ps.filter(function (p) { return p.atRisk; }).length;
  var soon = {}; P.OWNERS.forEach(function (o) { soon[o] = []; });
  var horizon = today.getTime() + 14 * 86400000;
  ps.forEach(function (p) { p.steps.forEach(function (s) { if (!s.done && s.due.getTime() <= horizon) soon[s.owner].push({ id: p.id, s: s }); }); });
  var cols = P.STAGES.map(function (st, i) {
    var cards = ps.filter(function (p) { return p.stage === i; }).map(function (p) {
      var a = D.getApp(p.id);
      return '<div class="card-s' + (p.atRisk ? ' risk' : '') + '"><div class="cs-h">' + appLink(p.id) + ' <span>' + esc(a.name) + '</span></div>' +
        '<small>' + esc(a.city) + ', ' + esc(a.pin) + ' · opens ' + fmt(p.open) + '</small>' +
        (p.next ? '<p>' + esc(p.next.title) + '<br><span class="muted">' + esc(p.next.owner) + ', due ' + fmt(p.next.due) + (p.next.overdue ? ' (overdue)' : '') + '</span></p>' : '<p>Open</p>') +
        (p.atRisk ? '<p class="risk">' + esc(p.risks.join('; ')) + '</p>' : '') +
        '<div class="cs-b"><button class="btn sm" data-act="stage" data-id="' + esc(p.id) + '" data-v="-1"' + (i ? '' : ' disabled') + ' aria-label="Move back">‹</button>' +
        '<button class="btn sm" data-act="stage" data-id="' + esc(p.id) + '" data-v="1"' + (i < P.STAGES.length - 1 ? '' : ' disabled') + '>Mark ' + esc((P.STAGES[i + 1] || 'done').toLowerCase()) + ' ›</button></div></div>';
    }).join('');
    return '<section class="col"><h4>' + esc(st) + ' <span class="muted">' + ps.filter(function (p) { return p.stage === i; }).length + '</span></h4>' + cards + '</section>';
  }).join('');
  var owners = P.OWNERS.map(function (o) {
    return '<div><b>' + esc(o) + '</b> <span class="muted">' + soon[o].length + '</span><ul>' + (soon[o].map(function (x) { return '<li>' + appLink(x.id) + ' ' + esc(x.s.title) + ' <span class="muted">by ' + fmt(x.s.due) + '</span></li>'; }).join('') || '<li class="muted">Nothing due</li>') + '</ul></div>';
  }).join('');
  var plans = ps.map(function (p) {
    var a = D.getApp(p.id);
    return '<details class="pl"><summary>' + esc(p.id) + ' ' + esc(a.name) + ': sign by ' + fmt(p.latestSign) + ', open ' + fmt(p.open) + (p.atRisk ? ' <span class="risk">at risk</span>' : '') + '</summary>' +
      '<p class="muted sm">' + esc(p.basis) + (p.conditions.length ? ' Conditions: ' + esc(p.conditions.join('; ')) + '.' : '') + '</p>' +
      '<table class="cmp"><thead><tr><th>Step</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>' +
      p.steps.map(function (s) { return '<tr><td>' + esc(s.title) + '</td><td>' + esc(s.owner) + '</td><td>' + fmt(s.due) + '</td><td>' + (s.done ? 'Done' : s.overdue ? '<span class="risk">Overdue</span>' : 'To do') + '</td></tr>'; }).join('') +
      '</tbody></table></details>';
  }).join('');
  return '<div class="onb"><p class="lede sm">' + ps.length + ' approved partner' + (ps.length === 1 ? '' : 's') + ', ' + risk + ' at risk. Each plan runs back from the target launch to the latest date the agreement can be signed; every step has an owner and a due date.</p>' +
    '<div class="sboard">' + cols + '</div><h4 class="mt">Due in the next 14 days, by owner</h4><div class="owners">' + owners + '</div>' +
    '<h4 class="mt">Plans</h4>' + plans + '</div>';
}

/* ---------- Decision log tab ---------- */
function logHtml() {
  var tr = TR.triggers(S), ids = Object.keys(tr);
  var waiting = ids.length ? '<ul class="wait">' + ids.map(function (id) {
    var t = tr[id]; return '<li>' + appLink(id) + ' ' + pill(t.outcome, true) + ' <span>' + esc(t.events.join('; or ') || 'No trigger: needs a person') + '</span>' + (t.then ? ' <span class="muted">Then: ' + esc(t.then) + '.</span>' : '') + '</li>';
  }).join('') + '</ul>' : '<p class="muted">Nothing is waiting.</p>';
  var rows = S.log.slice().reverse().map(function (e) {
    return '<tr><td class="muted">' + fmtT(e.at) + '</td><td><span class="kind k-' + esc(e.kind.split(' ')[0].toLowerCase()) + '">' + esc(e.kind) + '</span></td><td>' + (e.id ? appLink(e.id) : '') + '</td><td>' +
      (e.to ? (e.from ? pill(e.from, true) + ' to ' : '') + pill(e.to, true) + ' ' : '') + esc(e.text || '') + '</td></tr>';
  }).join('');
  return '<div class="logv"><h4>Decide again when</h4><p class="muted sm">For every held or waitlisted application, the event that would change the decision. Tell the desk when it happens and everything is decided again.</p>' + waiting +
    '<h4 class="mt">Decision log <span class="muted">' + S.log.length + ' entries, included in the export</span></h4><div class="tscroll"><table class="cmp lg"><tbody>' + rows + '</tbody></table></div></div>';
}

window.DeskExt.tabs.push({ id: 'onboard', label: 'Onboarding', render: onboardHtml });
window.DeskExt.tabs.push({ id: 'log', label: 'Decision log', render: logHtml });

/* ---------- export ---------- */
window.DeskExt.exportSheets.push(function () {
  return { name: 'Decision log', rows: [['Time', 'Type', 'Application', 'From', 'To', 'Detail']].concat(S.log.map(function (e) { return [e.at.toISOString(), e.kind, e.id || '', e.from || '', e.to || '', e.text || '']; })) };
});
window.DeskExt.exportSheets.push(function () {
  var rows = [['Application', 'Applicant', 'Stage', 'Planned opening', 'Latest signing', 'At risk', 'Step', 'Owner', 'Due', 'Status']];
  P.plans(S, new Date()).forEach(function (p) {
    var a = D.getApp(p.id);
    p.steps.forEach(function (s) { rows.push([p.id, a.name, P.STAGES[p.stage], fmt(p.open), fmt(p.latestSign), p.atRisk ? p.risks.join('; ') : '', s.title, s.owner, fmt(s.due), s.done ? 'Done' : s.overdue ? 'Overdue' : 'To do']); });
  });
  return { name: 'Onboarding plan', rows: rows };
});
window.DeskExt.exportSheets.push(function () {
  var tr = TR.triggers(S);
  return { name: 'Decide again when', rows: [['Application', 'Outcome', 'Decide again when (any of)', 'Then']].concat(Object.keys(tr).map(function (id) { var t = tr[id]; return [id, t.outcome, t.events.join('; or '), t.then]; })) };
});

/* ---------- Ask the desk: overrides in plain language ---------- */
function idIn(text) {
  var m = text.match(/\bapp[-\s_]?0*(\d{1,4})\b/i); if (!m) return null;
  var n = parseInt(m[1], 10), a = S.apps.filter(function (x) { return parseInt(x.id.replace(/#.*$/, '').replace(/\D/g, ''), 10) === n; })[0];
  return a ? a.id : 'APP-' + E.pad(n, 3);
}
window.DeskExt.answerers.push(function (text) {
  var low = text.toLowerCase(), id = idIn(text);
  if (!id || /^\s*(why|how|what|who|which|is|are|can|does|do)\b/.test(low)) return null;
  if (/\b(remove|cancel|clear|drop|undo|lift)\b[^.]*\boverride\b/.test(low)) return fromChat(id, null, '');
  var vm = low.match(/\b(approve|reject|waitlist|hold)\b/);
  if (!vm || !(/\b(override|anyway|regardless|manually|force)\b/.test(low) || /^\s*(please\s+)?(approve|reject|waitlist|put|move|place|keep|hold)\b/.test(low))) return null;
  var to = { approve: 'Approve', reject: 'Reject', waitlist: 'Waitlist', hold: 'Hold' }[vm[1]];
  var rm = text.match(/\b(?:because|since|as|reason:?|due to)\s+(.{3,})$/i);
  if (!rm) return '<p>To override ' + esc(id) + ' I need a reason, so it goes in the log. For example: "' + esc(to === 'Approve' ? 'Approve' : to) + ' ' + esc(id) + ' anyway because the partner already runs two of our kiosks".</p>';
  return fromChat(id, to, rm[1].replace(/[.\s]+$/, ''));
});
function fromChat(id, to, why) { var html = setOverride(id, to, why); S.askLog.pop(); return html; }   // ask() adds the answer itself

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-act="ovr-set"],[data-act="ovr-clear"],[data-act="stage"]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if (act === 'ovr-clear') setOverride(id, null, '');
  else if (act === 'ovr-set') {
    var to = document.querySelector('[data-ovr-to="' + id + '"]').value, why = document.querySelector('[data-ovr-why="' + id + '"]').value.trim();
    if (!why) { var er = document.querySelector('[data-ovr-err="' + id + '"]'); er.textContent = 'Give a reason first: it goes in the decision log.'; er.classList.add('bad'); return; }
    setOverride(id, to, why);
  } else if (act === 'stage') {
    var cur = S.stages[id] || 0, nx = Math.max(0, Math.min(P.STAGES.length - 1, cur + parseInt(el.getAttribute('data-v'), 10)));
    S.stages[id] = nx; log({ kind: 'Stage', id: id, text: 'Moved to ' + P.STAGES[nx] });
    D.rerender();
  }
});

var css = document.createElement('style');
css.textContent = [
  '.ovr { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }',
  '.ovr select, .ovr input { border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; background: var(--surface); font-size: 13.5px; }',
  '.ovr input { flex: 1; min-width: 160px; }',
  '.ovr-err { margin-top: 6px; } .ovr-err.bad { color: var(--no); }',
  '.ovr-now { font-size: 13.5px; border-radius: 6px; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--surface2); }',
  '.ovr-now.refused { border-left-color: var(--no); }',
  '.risk { color: var(--no); font-weight: 600; }',
  'p.risk { font-size: 13.5px; }',
  '.trig { margin: 4px 0; padding-left: 18px; font-size: 14px; }',
  '.sboard { display: grid; grid-template-columns: repeat(7, 196px); gap: 8px; overflow-x: auto; padding-bottom: 6px; }',
  '.sboard .col { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 120px; }',
  '.sboard .col h4 { font-family: var(--display); font-size: 13.5px; margin: 0 0 8px; }',
  '.card-s { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; margin-bottom: 6px; font-size: 13px; }',
  '.card-s.risk { border-color: var(--no); font-weight: 400; color: var(--ink); }',
  '.card-s p { margin: 4px 0; font-size: 12.5px; line-height: 1.35; } .card-s small { color: var(--muted); font-size: 12px; }',
  '.cs-h { font-weight: 600; } .cs-h span { font-weight: 500; }',
  '.cs-b { display: flex; gap: 4px; margin-top: 6px; } .cs-b .btn { padding: 2px 8px; font-size: 12px; }',
  '.owners { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }',
  '.owners > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }',
  '.owners ul { list-style: none; padding: 0; margin: 6px 0 0; } .owners li { margin-bottom: 4px; font-size: 13px; }',
  '.onb h4.mt, .logv h4.mt { margin: 20px 0 8px; } .onb h4, .logv h4 { font-family: var(--display); font-size: 15px; }',
  '.pl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; }',
  '.pl summary { cursor: pointer; font-weight: 600; font-size: 14px; } .pl .cmp { margin-top: 6px; }',
  '.pl .cmp th, .pl .cmp td { text-align: left; }',
  '.wait { list-style: none; padding: 0; margin: 6px 0; } .wait li { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }',
  '.tscroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; }',
  '.cmp.lg td { text-align: left; vertical-align: top; } .cmp.lg td:nth-child(-n+3) { white-space: nowrap; }',
  '.kind { font-size: 12px; font-weight: 600; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; white-space: nowrap; }',
  '.kind.k-override { color: var(--accent); border-color: var(--accent); } .kind.k-what-if { color: var(--wait); border-color: var(--wait); }',
  '@media (max-width: 1060px) { .owners { grid-template-columns: repeat(2, minmax(0, 1fr)); } }',
  '@media (max-width: 720px) { .owners { grid-template-columns: minmax(0, 1fr); } .sboard { grid-template-columns: repeat(7, 78vw); } }'
].join('\n');
document.head.appendChild(css);
})();

</script>
<script>
/* ext\ops-view.js */
// Operations view shown above the decisions list: pipeline and leakage, today's worklist, territory health,
// before and after, adoption metrics. Logic lives in src/modules/ops.js.
(function () {
'use strict';
var O = window.DeskOps, D = window.__desk, S = D.S, esc = D.esc;
var T = JSON.parse(JSON.stringify(O.DEFAULT_TIME));
var ev = O.newTracker(), seen = null;
var V = { open: true, more: {} };
var PCLASS = { High: 'p-high', Medium: 'p-med', Low: 'p-low' };

function n1(x) { return (Math.round(x * 10) / 10).toString(); }
function pct(a, b) { return b ? Math.round(100 * a / b) + '%' : '–'; }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function appLink(id) { return '<button class="link" data-act="open-app" data-v="' + esc(id) + '">' + esc(id) + '</button>'; }

/* ---------- pipeline ---------- */
function pipeHtml() {
  var p = O.pipeline(S), total = p[0].n, out = [];
  p.forEach(function (s, i) {
    if (i) {
      var lk = s.leakIds.length;
      out.push('<div class="leak' + (lk ? '' : ' none') + '">' + (lk ?
        '<button class="leak-n" data-act="ops-ids" data-ids="' + s.leakIds.join(',') + '" data-label="applications that dropped out before ' + esc(s.label.toLowerCase()) + '">−' + lk + '</button>' +
        '<ul>' + s.reasons.slice(0, 3).map(function (r) { return '<li>' + esc(r.reason) + (r.n > 1 ? ' <b>' + r.n + '</b>' : '') + '</li>'; }).join('') + (s.reasons.length > 3 ? '<li class="muted">and ' + (s.reasons.length - 3) + ' more</li>' : '') + '</ul>'
        : '<span class="muted">no drop-out</span>') + '</div>');
    }
    out.push('<button class="step s-' + s.key + '" data-act="ops-ids" data-ids="' + s.ids.join(',') + '" data-label="applications that reached ' + esc(s.label.toLowerCase()) + '">' +
      '<span>' + esc(s.label) + '</span><b>' + s.n + '</b><small>' + (i ? pct(s.n, total) + ' of received' : 'applications') + '</small></button>');
  });
  return '<div class="card pipe-card"><h3>Pipeline and where applications drop out</h3><p class="muted sm">Click a step or a drop-out to see those applications in the list below.</p><div class="pipe">' + out.join('') + '</div></div>';
}

/* ---------- worklist ---------- */
function copyBtn(m, many) {
  var a = D.getApp(m.id), lang = a.lang || 'English';
  return '<button class="btn sm" data-act="ops-copy" data-id="' + esc(m.id) + '" data-kind="' + m.kind + '" data-alt="' + esc(m.alt || '') + '">Copy message' + (many ? ' to ' + esc(m.id) : '') + ' (' + lang + ')</button>';
}
function workHtml() {
  var groups = O.worklist(S), total = 0;
  groups.forEach(function (g) { total += g.items.length; });
  var body = groups.filter(function (g) { return g.items.length; }).map(function (g) {
    var all = !!V.more[g.key], items = all ? g.items : g.items.slice(0, 3);
    return '<details class="wg"' + (g.key === 'verify' && !all ? '' : ' open') + '><summary><span>' + esc(g.label) + '</span><b>' + g.items.length + '</b></summary><ul class="wl">' + items.map(function (x) {
      return '<li><div class="wl-h">' + (x.priority ? '<span class="prio ' + PCLASS[x.priority] + '">' + x.priority + '</span>' : '<span class="prio">No territory</span>') +
        (x.name ? appLink(x.id) + ' <span>' + esc(x.name) + '</span>' : '') + '</div>' +
        '<p class="wl-t">' + esc(x.title.charAt(0).toUpperCase() + x.title.slice(1)) + '</p><p class="muted sm">' + esc(x.detail) + '</p>' +
        '<div class="wl-b">' + x.msgs.map(function (m) { return copyBtn(m, x.msgs.length > 1 || m.id !== x.id); }).join('') + '</div></li>';
    }).join('') + '</ul>' + (g.items.length > 3 ? '<button class="link sm" data-act="ops-more" data-v="' + g.key + '">' + (all ? 'Show fewer' : 'Show all ' + g.items.length) + '</button>' : '') + '</details>';
  }).join('');
  return '<div class="card"><h3>Worklist for today <span class="count">' + total + '</span></h3><p class="muted sm">What needs a person, highest-priority territory first, then by score. Messages are drafted in each applicant\'s language.</p>' +
    (body || '<p>Nothing needs a person right now.</p>') + '</div>';
}

/* ---------- territory health ---------- */
var FLAG = { over: 'Oversubscribed', under: 'Undersubscribed', short: 'Short of pins', locked: 'Pins locked' };
function healthHtml() {
  var rows = O.territoryHealth(S).map(function (t) {
    var dots = ''; for (var i = 0; i < t.slots; i++) dots += '<i class="sdot' + (i < t.filled ? ' on' : '') + '"></i>';
    return '<li><div class="th-h"><b>' + esc(t.id) + '</b> <span>' + esc(t.city) + '</span><span class="prio ' + PCLASS[t.priority] + '">' + t.priority + '</span>' +
      '<span class="grow"></span><span class="dots" title="' + t.filled + ' of ' + t.slots + ' slots filled">' + dots + '</span><small class="muted">' + t.filled + ' filled, ' + t.open + ' open, ' + t.locked + ' blocked</small></div>' +
      (t.flags.length ? '<ul class="tf">' + t.flags.map(function (f) { return '<li class="f-' + f.k + '"><span>' + FLAG[f.k] + '</span> ' + esc(f.text.replace(/^[^:]+: /, '')) + '</li>'; }).join('') + '</ul>' : '<p class="muted sm">Balanced: every slot has a partner.</p>') + '</li>';
  }).join('');
  return '<div class="card"><h3>Territory health</h3><p class="muted sm">Slots filled, open and blocked per territory. Blocked means a pin with an existing store.</p><ul class="th">' + rows + '</ul></div>';
}

/* ---------- before and after ---------- */
function tIn(k, label) { return '<label class="ba-in"><span>' + label + '</span><input type="number" min="0" step="1" value="' + T[k] + '" data-ops-t="' + k + '"></label>'; }
function baHtml() {
  var b = O.beforeAfter(S, T), caught = 0;
  b.caught.forEach(function (c) { caught += c.ids.length; });
  return '<div class="card"><h3>Before and after, for this file</h3>' +
    '<div class="ba-out">' +
      '<div><small>Team hours on this file</small><b>' + n1(b.manualHours) + ' <i>→</i> ' + n1(b.deskHours) + '</b><span>' + n1(b.savedHours) + ' hours saved</span></div>' +
      '<div><small>Time to decide the whole file</small><b>' + n1(b.manualDays) + ' <i>→</i> ' + n1(b.deskDays) + '</b><span>working days</span></div>' +
      '<div><small>Problems caught before signing</small><b>' + caught + '</b><span>pin conflicts and contradictions</span></div>' +
    '</div>' +
    '<p class="muted sm">By hand: ' + b.n + ' applications × (' + T.screenMin + ' + ' + T.pinMin + ' min) + ' + plural(b.follow, 'follow-up') + ' × ' + T.followMin + ' min. ' +
      'With the desk: ' + b.n + ' × ' + T.reviewMin + ' min review + ' + b.follow + ' × ' + T.sendMin + ' min to send. Days assume ' + T.teamHours + ' hours of screening a day.</p>' +
    '<ul class="caught">' + b.caught.filter(function (c) { return c.ids.length; }).map(function (c) { return '<li>' + esc(c.label) + ': ' + c.ids.map(appLink).join(', ') + '</li>'; }).join('') + '</ul>' +
    '<details class="ba-a"><summary>Assumptions (minutes, our estimates; change them to match your team)</summary><div class="ba-grid">' +
      tIn('screenMin', 'Screen one application by hand') + tIn('pinMin', 'Cross-check one pin by hand') + tIn('followMin', 'Write one follow-up by hand') +
      tIn('reviewMin', 'Review one decision with the desk') + tIn('sendMin', 'Send one drafted message') + tIn('teamHours', 'Screening hours a day') +
    '</div></details></div>';
}

/* ---------- adoption ---------- */
function adoptHtml() {
  var a = O.adoption(S, ev);
  var tile = function (lbl, big, sub) { return '<div><small>' + lbl + '</small><b>' + big + '</b><span>' + sub + '</span></div>'; };
  return '<div class="card"><h3>Adoption metrics</h3><p class="muted sm">Counted live in this session. In a pilot these come from the decision log, week by week.</p><div class="ba-out ad">' +
    tile('Decisions accepted without override', pct(a.accepted.n, a.accepted.of), a.accepted.n + ' of ' + a.accepted.of + (a.accepted.overrides ? ', ' + plural(a.accepted.overrides, 'override') : ', no overrides')) +
    tile('Time to resolve a hold', a.holds.medianMin == null ? '–' : a.holds.medianMin < 1 ? 'under 1 min' : n1(a.holds.medianMin) + ' min', a.holds.resolved + ' resolved, ' + a.holds.open + ' still open') +
    tile('Slot-fill rate', pct(a.slotFill.filled, a.slotFill.slots), a.slotFill.filled + ' of ' + a.slotFill.slots + ' slots') +
    tile('Messaged in their own language', a.language.copies ? pct(a.language.inPref, a.language.copies) : '–', a.language.inPref + ' of ' + plural(a.language.copies, 'message') + ' copied; ' + a.language.withPref + ' of ' + a.language.of + ' gave a language') +
    '</div></div>';
}

// note when holds start and clear; safe to call on every render
function sync() {
  if (!S.run) return;
  if (seen !== S.initial) { seen = S.initial; ev = O.newTracker(); }
  O.track(S, ev, Date.now());
}

function view() {
  if (!S.run) return '';
  sync();
  return '<section class="ops" aria-label="Operations view"><header class="ops-h"><h2>Operations view</h2><button class="link sm" data-act="ops-toggle">' + (V.open ? 'Hide' : 'Show') + '</button></header>' +
    (V.open ? pipeHtml() + '<div class="ops-grid">' + workHtml() + healthHtml() + '</div><div class="ops-grid">' + baHtml() + adoptHtml() + '</div>' : '') + '</section>';
}

window.DeskExt.afterSummary.push(view);
window.DeskExt.afterRender.push(sync);

function copy(text, el) {
  var label = el.textContent, done = function () { el.textContent = 'Copied'; setTimeout(function () { el.textContent = label; }, 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
  else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} document.body.removeChild(ta); done(); }
}
function logCopy(id, lang) {
  var a = D.getApp(id); if (!a) return;
  ev.copies.push({ id: id, lang: lang, pref: a.lang || 'English' });
  var card = document.querySelector('.ops .ad'); if (card) card.parentNode.outerHTML = adoptHtml();
}

// row "Copy message" in the decisions list counts toward the language metric too
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-act="copy"]'); if (!el) return;
  var id = el.getAttribute('data-id'), a = D.getApp(id);
  if (a) logCopy(id, S.letterLang[id] || a.lang || 'English');
}, true);

document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-act^="ops-"]'); if (!el) return;
  var act = el.getAttribute('data-act');
  if (act === 'ops-toggle') { V.open = !V.open; D.rerender(); }
  else if (act === 'ops-more') { var k = el.getAttribute('data-v'); V.more[k] = !V.more[k]; D.rerender(); }
  else if (act === 'ops-copy') {

  }

  '  .leak { border-top: 0; border-left: 2px dashed color-mix(in srgb, var(--hold) 55%, transparent); padding: 2px 0 2px 12px; margin-left: 14px; display: flex; gap: 10px; align-items: flex-start; }',
  '  .leak.none { border-left-color: var(--line); } .leak ul { margin: 0; }',
  '  .ba-out { grid-template-columns: minmax(0, 1fr); } .ba-out.ad { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ba-grid { grid-template-columns: minmax(0, 1fr); }',

<script>
/* ext\understand.js */
// Broader follow-ups in the Ask box: typos, other ways of naming IDs, several changes in one sentence,
// "Would ... if ...?" previews, and an "I read this as ..." check before anything uncertain is applied.
// Text handling is in src/modules/understand.js; every change goes through the same functions as the Ask box (ui.js).
(function () {
'use strict';
var D = window.__desk, S = D.S, E = D.E, esc = D.esc, pill = D.pill, U = window.DeskUnderstand;
var busy = false, pending = {}, seq = 0;
var QUESTION = /^(why|how|who|which|list|show|explain|compare|tell|give|is|are|does|do|summar|what(?!\s+if)|whats|status|reason)/i;
var INFO_CUE = /\b(now|found|has|have|got|just|updated?|changed?|secured|signed|withdr\w*|moved|rented|bought|raised|can|will)\b/i;

function appLink(id) { return '<button class="link" data-act="open-app" data-v="' + esc(id) + '">' + esc(id) + '</button>'; }
function mentionsId(t) { return /\b(APP|TER)-\d+/i.test(t); }

/* ---------- turning a clause into a planned change ---------- */
function planFor(clause) {
  var low = clause.toLowerCase(), tids = D.findTers(clause), ids = D.findIds(clause);
  if (tids.length && !/\bAPP-\d/i.test(clause)) {
    var tf = D.parseTerritoryChange(low), t = S.ters.filter(function (x) { return x.id === tids[0]; })[0];
    if (!t) return { clause: clause, problem: 'I cannot find ' + tids[0] + ' in this file.' };
    if (tf.slots === undefined && !tf.priority) return null;
    return { clause: clause, kind: 'ter', id: t.id, tf: tf, checks: [] };
  }
  if (!ids.length) return null;
  var a = D.getApp(ids[0]);
  if (!a) return { clause: clause, problem: 'I cannot find ' + ids[0] + ' in this file.' };
  var f = D.parseFields(low), rel = U.relativeInvest(clause);
  if (rel != null) f.invest = Math.round(((a.invest || 0) + rel) * 100) / 100;
  if (!Object.keys(f).length) return null;
  var p = { clause: clause, kind: 'app', id: a.id, f: f, rel: rel, checks: [] };
  if (!/\bAPP-\d/i.test(clause)) p.checks.push('No ID was given, so I matched the name to ' + a.id + ' ' + a.name + (ids.length > 1 ? ' (also possible: ' + ids.slice(1).join(', ') + ')' : '') + '.');
  if (f.invest !== undefined && (f.invest > 200 || f.invest <= 0)) p.checks.push('Rs ' + f.invest + ' lakh is unusual for one store; is the figure right?');
  if (f.size !== undefined && (f.size < 100 || f.size > 3000)) p.checks.push(f.size + ' sq ft is unusual for a store; is the size right?');
  if (f.launch !== undefined && f.launch > 36) p.checks.push('A target launch of ' + f.launch + ' months is unusual; is it right?');
  if (f.exp !== undefined && f.exp > 45) p.checks.push(f.exp + ' years of experience is unusual; is it right?');
  if (f.pin) { var c = E.CITIES[a.city]; if (c && f.pin.indexOf(c.prefix) !== 0) p.checks.push('Pin ' + f.pin + ' is not in ' + a.city + ' (pins there start with ' + c.prefix + ').'); }
  if (/ground/.test(low) && /(first|1st|second|2nd|upper|terrace)\s+floor/.test(low)) p.checks.push('Both a ground floor and an upper floor are mentioned; I took ground floor.');
  return p;
}
function describe(p) {
  if (p.kind === 'ter') {
    var t = S.ters.filter(function (x) { return x.id === p.id; })[0], bits = [];
    if (p.tf.slots !== undefined) bits.push('open slots ' + t.slots + ' to ' + (p.tf.add ? t.slots + p.tf.slots : p.tf.slots));
    if (p.tf.priority) bits.push('priority ' + t.priority + ' to ' + p.tf.priority);
    return '<b>' + esc(p.id) + '</b>: ' + esc(bits.join(', '));
  }
  var f = p.f, a = D.getApp(p.id), b = [];
  if (f.withdraw) b.push('has withdrawn');
  if (f.spaceFound) b.push('has found ' + (f.space ? 'an ' + f.space.toLowerCase() : 'a') + ' space');
  if (f.size !== undefined) b.push(f.size + ' sq ft');
  if (f.floor) b.push(f.floor === 'Mall unit' ? 'in a mall' : f.floor.toLowerCase() + ' floor');
  if (f.invest !== undefined) b.push('investment Rs ' + f.invest + ' lakh' + (p.rel != null ? ' (Rs ' + (a.invest || 0) + ' + ' + p.rel + ')' : ''));
  if (f.exp !== undefined) b.push(f.exp + ' years of retail experience');
  if (f.launch !== undefined) b.push('target launch ' + f.launch + ' months');
  if (f.pin) b.push('pin ' + f.pin);
  if (f.lang) b.push('prefers ' + f.lang);
  return '<b>' + esc(p.id) + '</b> ' + esc(a.name) + ': ' + esc(b.join(', '));
}
function applyTo(plans, apps, ters) {
  plans.forEach(function (p) {
    if (p.kind === 'app') { var a = apps.filter(function (x) { return x.id === p.id; })[0]; if (a) D.applyAppFields(a, JSON.parse(JSON.stringify(p.f))); }
    else { var t = ters.filter(function (x) { return x.id === p.id; })[0]; if (t) { if (p.tf.slots !== undefined) t.slots = p.tf.add ? t.slots + p.tf.slots : p.tf.slots; if (p.tf.priority) t.priority = p.tf.priority; } }
  });
}

/* ---------- applying, previewing, confirming ---------- */
function apply(plans, text, kind) {
  var lines = plans.map(describe);   // before the change, so "from" values are the old ones
  D.pushUndo();
  applyTo(plans, S.apps, S.ters);
  S.cause = { kind: kind || 'New information', text: text };
  var diff = D.recompute(); S.cause = null;
  D.rerender();
  var appIds = plans.filter(function (p) { return p.kind === 'app'; }).map(function (p) { return p.id; });
  return '<p class="ap">' + (plans.length > 1 ? 'Recorded ' + plans.length + ' changes:' : 'Recorded:') + '</p><ol class="rd">' + lines.map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ol>' +
    '<p><b>What changed</b></p>' + D.diffHtml(diff) + (appIds.length === 1 ? D.explainCard(appIds[0]) : '') + '<p class="nx">Undo reverses all of this in one step.</p>';
}
function preview(plans) {
  var apps = E.clone(S.apps), ters = E.clone(S.ters), keepLang = E.clone(S.letterLang);
  applyTo(plans, apps, ters);
  S.letterLang = keepLang;
  var r2 = E.run(apps, ters, E.STORES, S.cfg), moves = [];
  apps.forEach(function (a) {
    var now = r2.res[a.id] ? r2.res[a.id].outcome : 'Withdrawn';
    if (S.run.res[a.id] && S.run.res[a.id].outcome !== now) moves.push({ id: a.id, from: S.run.res[a.id].outcome, to: now });
  });
  var k = remember(plans, 'Applied from a question: ' + plans.map(function (p) { return p.clause; }).join('; '), 'What-if');
  return '<p class="ap">If that happened:</p><ol class="rd">' + plans.map(function (p) { return '<li>' + describe(p) + '</li>'; }).join('') + '</ol>' +
    (moves.length ? '<ul class="diff">' + moves.map(function (m) { return '<li>' + appLink(m.id) + ' would move ' + pill(m.from, true) + ' to ' + pill(m.to, true) + '</li>'; }).join('') + '</ul>' : '<p>No decision would change.</p>') +
    '<p class="nx">Nothing has changed yet.</p>' + buttons(k, 'Apply it', 'Leave it');
}
function remember(plans, text, kind) { var k = 'u' + (++seq); pending[k] = { plans: plans, text: text, kind: kind }; return k; }
function buttons(k, yes, no) { return '<div class="rd-b"><button class="btn sm primary" data-act="und-yes" data-k="' + k + '">' + yes + '</button><button class="btn sm" data-act="und-no" data-k="' + k + '">' + no + '</button></div>'; }
function confirmCard(plans, n, text) {
  var checks = []; plans.forEach(function (p) { (p.checks || []).forEach(function (c) { checks.push(c); }); });
  var k = remember(plans, text, 'New information');
  return '<p class="ap">I read this as:</p><ol class="rd">' + plans.map(function (p) { return '<li>' + describe(p) + '</li>'; }).join('') + '</ol>' +
    (n.fixes.length ? '<p class="nx">Spelling read as: ' + n.fixes.map(function (f) { return '“' + esc(f[0]) + '” as “' + esc(f[1]) + '”'; }).join(', ') + '.</p>' : '') +
    checks.map(function (c) { return '<p class="nx">' + esc(c) + '</p>'; }).join('') +
    '<p>Is that right? Nothing has changed yet.</p>' + buttons(k, 'Yes, apply', 'No');
}
function readAs(n, html) { return '<p class="nx">I read this as “' + esc(n.text) + '”.</p>' + html; }

/* ---------- the answerer, tried before the standard one ---------- */
window.DeskExt.answerers.unshift(function (text) {
  if (busy || !S.run) return null;
  var n = U.normalize(text), t = n.text, low = t.toLowerCase().trim();
  if (/^(undo|revert)\b/.test(low)) return null;
  var changed = t !== text;
  var hyp = U.isHypothetical(t);
  var asks = QUESTION.test(low) && !hyp;
  var plans = [], problems = [];
  if (!asks || hyp) U.split(t).forEach(function (c) { var p = planFor(c); if (!p) return; if (p.problem) problems.push(p.problem); else plans.push(p); });

  if (hyp && plans.length) return (n.fixes.length ? '<p class="nx">I read this as “' + esc(t) + '”.</p>' : '') + preview(plans);
  if (problems.length && !plans.length && mentionsId(t)) return '<p>' + problems.map(esc).join(' ') + '</p>';
  var uncertain = n.fixes.length || problems.length || plans.some(function (p) { return p.checks.length; });
  if (plans.length >= 2 || (plans.length === 1 && (uncertain || plans[0].rel != null))) {
    if (problems.length) plans.forEach(function (p) { p.checks = (p.checks || []).concat(problems); });
    return uncertain ? confirmCard(plans, n, text) : apply(plans, text, /\bwhat if\b/i.test(t) ? 'What-if' : 'New information');
  }
  // nothing to change but the wording was cleaned up: answer the cleaned-up text
  if (changed && !plans.length) {
    if (!asks && mentionsId(t) && INFO_CUE.test(low) && !/\?$/.test(low)) return noFields(t);
    busy = true; try { return readAs(n, D.answer(t)); } finally { busy = false; }
  }
  if (changed && plans.length === 1) { busy = true; try { return D.answer(t); } finally { busy = false; } }   // e.g. "application 12 found a shop"
  // an ID and news, but nothing the desk can record
  if (!plans.length && !asks && mentionsId(t) && INFO_CUE.test(low) && !/\?$/.test(low) && !/\b(what if|override|anyway|approve|reject|waitlist|hold|remove|undo)\b/.test(low)) return noFields(t);
  return null;
});
function noFields(t) {
  var id = (D.findIds(t)[0] || D.findTers(t)[0] || '');
  return '<p>I could not tell what changed' + (id ? ' for <b>' + esc(id) + '</b>' : '') + ', so nothing was updated.</p><p class="nx">I can record a space (size and floor), investment, years of experience, target launch, pin code, preferred language, a withdrawal, or a territory\'s open slots and priority. For example: “' + esc(id || 'APP-012') + ' has found a 400 sq ft ground-floor shop”.</p>';
}

document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-act="und-yes"],[data-act="und-no"]'); if (!el) return;
  var k = el.getAttribute('data-k'), p = pending[k];
  if (!p) return;
  delete pending[k];
  var html = el.getAttribute('data-act') === 'und-yes' ? apply(p.plans, p.text, p.kind) : '<p>Okay, nothing changed.</p>';
  S.askLog.push({ who: 'desk', html: html });
  D.rerender();
});

var css = document.createElement('style');
css.textContent = '.rd { margin: 4px 0 6px; padding-left: 20px; font-size: 14px; } .rd li { margin-bottom: 2px; } .rd-b { display: flex; gap: 6px; margin-top: 6px; }';
document.head.appendChild(css);
})();

</script>
