<style>
:root {

}
@media (prefers-color-scheme: dark) {

    --bg: #0f151c; --surface: #171f28; --surface2: #1d2631; --ink: #e6ebf1; --muted: #9aa8b7; --line: #2b3745;
    --accent: #8aa4ff; --accent-ink: #0f151c; --ok: #4cc38a; --wait: #a995ee; --hold: #e5a649; --no: #f2877e; --gone: #8a97a5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #171f28; --surface2: #1d2631; --ink: #e6ebf1; --muted: #9aa8b7; --line: #2b3745;
  --accent: #8aa4ff; --accent-ink: #0f151c; --ok: #4cc38a; --wait: #a995ee; --hold: #e5a649; --no: #f2877e; --gone: #8a97a5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
button, input { font: inherit; color: inherit; }

h1, h2, h3, h4 { margin: 0; font-weight: 600; }
p { margin: 0 0 8px; }

.grow { flex: 1; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }

.logo { width: 26px; height: 26px; }
.top .actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.top .jump-ask { display: none; text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn[disabled], .link[disabled] { opacity: .4; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: inherit; text-align: left; }
#err { margin: 12px max(18px, env(safe-area-inset-left, 0px)) 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--no); color: var(--no); background: color-mix(in srgb, var(--no) 8%, var(--surface)); }

/* empty state */
.empty { max-width: 760px; margin: 0 auto; padding: 8vh 22px 10vh; }
.empty h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 5.4vw, 52px); line-height: 1.04; letter-spacing: -0.02em; margin-bottom: 16px; }
.lede { font-size: 17px; color: var(--muted); max-width: 60ch; }
.lede.sm { font-size: 14.5px; margin-bottom: 14px; }
.drop { margin-top: 26px; border: 2px dashed var(--line); border-radius: 14px; padding: 30px 22px; display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; background: var(--surface); }
.drop span { color: var(--muted); }
.fine { margin-top: 16px; font-size: 13px; color: var(--muted); }

/* workspace */
.workspace { max-width: 1480px; margin: 0 auto; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 40px max(18px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 22px; align-items: start; }
.primary { min-width: 0; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.sum-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sum-top h2 { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.sum-meta { font-size: 13.5px; color: var(--muted); }
.bar { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface2); }
.seg { display: block; min-width: 6px; background: var(--c, var(--gone)); }
.legend { display: flex; gap: 4px 16px; flex-wrap: wrap; margin-top: 10px; }
.leg { background: none; border: 0; padding: 2px 0; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
.ok { --c: var(--ok); } .wait { --c: var(--wait); } .hold { --c: var(--hold); } .no { --c: var(--no); } .gone { --c: var(--gone); }
.notices { margin-bottom: 12px; }
.notices p { font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--hold); border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; }

.tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs .btn { flex: none; white-space: nowrap; margin-bottom: 4px; }
.tab { white-space: nowrap; background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; font-weight: 500; text-align: left; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; min-width: 220px; }

/* decision rows */
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.row.open { border-color: var(--accent); }
.row.gone { opacity: .7; }
.row-h { width: 100%; display: grid; grid-template-columns: 74px minmax(130px, 1.1fr) auto 44px minmax(0, 2.3fr) 14px; gap: 12px; align-items: center; background: none; border: 0; text-align: left; padding: 11px 14px; }
.row.gone .row-h { grid-template-columns: 74px minmax(130px, 1.1fr) auto 1fr; padding: 11px 14px; display: grid; }
.rid { font-weight: 600; white-space: nowrap; }
.rname { display: flex; flex-direction: column; line-height: 1.25; font-weight: 500; }
.rname small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.rout { display: flex; align-items: center; gap: 8px; }
.was { font-size: 12px; color: var(--muted); }
.score { font-family: var(--display); font-weight: 800; font-size: 18px; text-align: right; }
.score.off { color: var(--muted); font-weight: 400; }
.rwhy { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.open .rwhy { white-space: normal; }
.chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); justify-self: center; transition: transform .15s; }
.row.open .chev { transform: rotate(-135deg); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); white-space: nowrap; }
.pill.sm { padding: 0 8px; font-size: 12px; }

.detail { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 26px; padding: 6px 18px 20px; border-top: 1px solid var(--line); }
.detail h4 { font-family: var(--display); font-size: 15px; margin: 16px 0 6px; }
.detail h4:first-child { margin-top: 12px; }
.dcol p { font-size: 14.5px; }
.cond { background: var(--surface2); border-radius: 6px; padding: 8px 10px; font-size: 13.5px !important; }
.tl { list-style: none; margin: 8px 0; padding: 0; }
.tl li { border-left: 2px solid var(--line); padding: 0 0 12px 14px; position: relative; font-size: 14.5px; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl li b { font-weight: 600; margin-right: 6px; }
.tl li span { display: block; color: var(--muted); font-size: 13.5px; }
.bp { margin-bottom: 9px; }
.bp-l { display: flex; justify-content: space-between; font-size: 13.5px; }
.bp-l small { color: var(--muted); font-weight: 400; }
.track { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin: 3px 0 2px; border: 1px solid var(--line); }
.track i { display: block; height: 100%; background: var(--accent); }
.flags { list-style: none; padding: 0; margin: 0; }
.fl { display: flex; gap: 9px; font-size: 13.5px; margin-bottom: 6px; }
.fdot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--gone); }
.fl.hold .fdot { background: var(--hold); } .fl.reject .fdot { background: var(--no); } .fl.soft .fdot { background: var(--wait); } .fl.clean .fdot { background: var(--ok); }
.seg-g { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.seg-b { background: var(--surface); border: 0; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.seg-b.on { background: var(--accent); color: var(--accent-ink); }
.letter { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; line-height: 1.6; margin-bottom: 8px; }
.letter[lang="hi"] { font-family: 'Noto Sans Devanagari', 'Nirmala UI', Mangal, 'Kohinoor Devanagari', 'Devanagari Sangam MN', var(--body); }
.letter[lang="kn"] { font-family: 'Noto Sans Kannada', 'Nirmala UI', Tunga, 'Kannada Sangam MN', var(--body); }
.rec { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; font-size: 13.5px; margin: 0; }
.rec dt { color: var(--muted); } .rec dd { margin: 0; }

/* pin board */
.b-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.b-legend span { display: inline-flex; align-items: center; gap: 7px; }
.b-legend .tile { width: 24px; height: 16px; padding: 0; border-radius: 4px; }
.board { display: flex; flex-direction: column; gap: 14px; }
.terr { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; margin-bottom: 0; }
.terr header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.terr h3 { font-family: var(--display); font-size: 17px; font-weight: 800; }
.slots { display: flex; align-items: center; gap: 8px; }
.dots { display: inline-flex; gap: 4px; }
.sdot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ok); display: block; }
.sdot.on { background: var(--ok); }
.slots small { color: var(--muted); font-size: 12.5px; }
.tiles, .outside { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; width: 104px; height: 64px; padding: 7px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; }
.tile b { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--muted); letter-spacing: 0.01em; }
.tile b u { text-decoration: none; font-weight: 800; color: var(--ink); }
.tile span { font-size: 12.5px; font-weight: 600; }
.tile em { position: absolute; bottom: 7px; right: 9px; font-style: normal; font-size: 12px; font-weight: 600; color: var(--wait); }
.t-open span { color: var(--muted); font-weight: 400; }
.t-store { border-style: dashed; background: repeating-linear-gradient(135deg, var(--surface2) 0 6px, var(--surface) 6px 12px); }
.t-store span { color: var(--muted); }
.t-ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, var(--surface)); } .t-ok span { color: var(--ok); }
.t-wait { border-color: var(--wait); background: color-mix(in srgb, var(--wait) 11%, var(--surface)); } .t-wait span { color: var(--wait); }
.t-hold { border-color: var(--hold); border-style: dotted; background: color-mix(in srgb, var(--hold) 9%, var(--surface)); } .t-hold span { color: var(--hold); }
button.tile:hover { transform: translateY(-1px); }

/* assumptions */
.assume .a-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.assume section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.assume section.wide { grid-column: 1 / -1; }
.assume h4 { font-family: var(--display); font-size: 15px; margin-bottom: 8px; }
.assume h4.mt { margin: 22px 0 8px; }
.a-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px; }
.fld { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.fld input { width: 74px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); text-align: right; }
.w-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 22px; }
.rules { padding-left: 20px; font-size: 14px; color: var(--muted); }
.rules li { margin-bottom: 4px; }

/* ask panel */
.ask { position: sticky; top: calc(66px + env(safe-area-inset-top, 0px)); }
.ask-in { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 92px); }
.ask-in h2 { font-family: var(--display); font-size: 19px; font-weight: 800; }
.log { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 96px; flex: 1 1 auto; padding-right: 2px; }
.msg { border-radius: 10px; padding: 9px 12px; font-size: 14px; max-width: 100%; }
.msg p { font-size: 14px; margin-bottom: 6px; } .msg p:last-child { margin-bottom: 0; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); max-width: 88%; }
.msg.desk { background: var(--surface2); border: 1px solid var(--line); }
.msg .nx { color: var(--muted); }
.msg .ap { font-weight: 500; }
.diff { list-style: none; padding: 0; margin: 4px 0 8px; font-size: 13.5px; }
.diff li { padding: 3px 0; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); }
.ask-tools { display: flex; justify-content: space-between; font-size: 13px; }
.cmp { border-collapse: collapse; font-size: 13.5px; width: 100%; }
.cmp th, .cmp td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp .tot td { font-weight: 600; }

@media (max-width: 1060px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .ask { position: static; }
  body:has(.workspace) .top .jump-ask { display: inline-flex; }
  .ask-in { max-height: none; }
  .log { max-height: 420px; }
  .detail { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
@media (max-width: 720px) {
  .row-h { grid-template-columns: auto minmax(0, 1fr) auto 14px; row-gap: 4px; }
  .brand small { display: none; }
  .row-h .score { display: none; }
  .row-h .rwhy { grid-column: 1 / -1; white-space: normal; }
  .rout { grid-column: 3; }
  .assume .a-grid { grid-template-columns: minmax(0, 1fr); }
  .w-grid { grid-template-columns: minmax(0, 1fr); }
  .top .actions { margin-left: 0; width: 100%; }
  .tabs { flex-wrap: wrap; } .tabs .grow { display: none; }
  .top { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } button.tile:hover { transform: none; } }
</style>

/* ------------------------------------------------------------------ */
/* Assumptions (every one of these is editable in the UI)              */
/* ------------------------------------------------------------------ */
var DEFAULT_CFG = {
  floors: { 'Tier 1': 30, 'Tier 2': 25, 'Tier 3': 20 },  // minimum investment, Rs lakh
  rejectRatio: 0.7,        // below 70% of the floor: not salvageable, reject
  minSpace: 250,           // sq ft hard minimum
  idealMin: 300, idealMax: 500,
  earliestWeeks: 10,       // agreement -> fit-out -> training -> opening
  noSpaceExtraWeeks: 6,    // extra time if the partner has no space yet
  cannibNear: 5,           // pin numbers apart: treated as adjacent to an existing store
  cannibMid: 25,
  firstTimerYears: 1,
  weights: { capital: 25, experience: 20, space: 25, timeline: 10, cannibal: 10, data: 10 }
};

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  var m = String(v).replace(/,/g, '').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
// Investment in Rs lakh, from 25, '25 lakh', '₹30L', '0.28 crore' or a full rupee amount like 'Rs 40,00,000'
function lakh(v) {
  var n = num(v); if (n === null) return null;
  var s = String(v).toLowerCase();
  if (/crore|\bcr\b/.test(s)) return Math.round(n * 10000) / 100;
  if (/lakh|lac|\d\s*l\b/.test(s)) return n;
  return n >= 10000 ? Math.round(n / 1000) / 100 : n;
}
function normHeader(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function canonCity(v) {
  var s = String(v == null ? '' : v).trim();
  if (CITIES[s]) return s;
  var k = s.toLowerCase().replace(/[^a-z]/g, '');
  return ALIASES[k] || s;
}
function r1(x) { return Math.round(x * 10) / 10; }
function pad(n, w) { n = String(n); while (n.length < w) n = '0' + n; return n; }

/* ------------------------------------------------------------------ */
/* Reading the uploaded sheets (arrays of arrays in, records out)      */
/* ------------------------------------------------------------------ */
var APP_KEYS = ['applicationid', 'applicationno', 'applicationnumber', 'appid', 'appno'];
var TER_KEYS = ['territoryid', 'territoryno', 'territorycode', 'territory'];
function findHeaderRow(aoa, keys) {
  keys = [].concat(keys);
  for (var i = 0; i < Math.min(aoa.length, 15); i++) {
    var row = aoa[i] || [];
    for (var j = 0; j < row.length; j++) {
      var h = normHeader(row[j]);
      if (keys.some(function (k) { return h === k || (h.indexOf(k) === 0 && h.length <= k.length + 12); })) return i;
    }
  }
  return -1;
}
// Finds the Applications and Territories sheets by their header row, whatever the sheets are called.
// sheets: { sheetName: arrayOfArrays }
function pickSheets(sheets) {
  var names = Object.keys(sheets), an = null, tn = null;
  names.forEach(function (n) {
    if (!an && findHeaderRow(sheets[n], APP_KEYS) >= 0) an = n;
    else if (!tn && findHeaderRow(sheets[n], TER_KEYS) >= 0) tn = n;
  });
  var list = names.map(function (n) { return '"' + n.trim() + '"'; }).join(', ');
  if (!an) throw new Error('No Applications sheet found: none of the sheets (' + list + ') has an "Application ID" column. Use the judges\' template layout.');
  if (!tn) throw new Error('No Territories sheet found in this workbook (sheets: ' + list + '). Add a sheet with the columns Territory ID, City, State, Pin codes covered, City tier, Open slots, Priority.');
  return { apps: sheets[an], ters: sheets[tn], appsName: an, tersName: tn };
}
function colFinder(headers) {
  var H = headers.map(normHeader);
  return function () {
    for (var a = 0; a < arguments.length; a++) {
      for (var i = 0; i < H.length; i++) if (H[i].indexOf(arguments[a]) === 0) return i;
    }
    return -1;
  };
}
function cell(row, i) { return i < 0 || i >= row.length || row[i] === undefined || row[i] === null ? '' : row[i]; }
function rowBlank(row) { return !row || row.every(function (c) { return String(c == null ? '' : c).trim() === ''; }); }

function normSpace(v) {
  var s = String(v == null ? '' : v).toLowerCase();
  if (/\bown/.test(s)) return 'Owned';
  if (/rent|lease/.test(s)) return 'Rented';
  return 'Not yet identified';
}
function normFloor(v) {
  var s = String(v == null ? '' : v).toLowerCase();
  if (/ground/.test(s)) return 'Ground';
  if (/mall/.test(s)) return 'Mall unit';
  if (/upper|first|1st|second|2nd|third|above|terrace/.test(s)) return 'Upper';
  return 'Not known';
}
function normLang(v) {
  var s = String(v == null ? '' : v).toLowerCase();
  if (/kann/.test(s)) return 'Kannada';
  if (/hin/.test(s)) return 'Hindi';
  if (/eng/.test(s)) return 'English';
  return '';
}
function normTier(v, city) {
  var m = String(v == null ? '' : v).match(/[123]/);
  if (m) return 'Tier ' + m[0];
  return CITIES[city] ? CITIES[city].tier : 'Tier 2';
}
function normPriority(v) {
  var s = String(v == null ? '' : v).toLowerCase();
  if (/high/.test(s)) return 'High';
  if (/low/.test(s)) return 'Low';
  return 'Medium';
}

function parseApplications(aoa) {
  var hi = findHeaderRow(aoa, APP_KEYS);
  if (hi < 0) throw new Error('Could not find an "Application ID" header row in the Applications sheet.');
  var ci = colFinder(aoa[hi]);
  var C = {
    id: ci.apply(null, APP_KEYS), name: ci('applicantname', 'nameofapplicant', 'applicantsname', 'fullname', 'name'), city: ci('city', 'town'), state: ci('state'),
    pin: ci('pincode', 'pin', 'postalcode', 'postcode'), invest: ci('investment', 'capital', 'budget'), exp: ci('retailexperience', 'experience'),
    biz: ci('currentpastbusiness', 'currentbusiness', 'business', 'occupation'), space: ci('spaceavailable', 'spacestatus', 'spaceownedrented', 'space', 'premises'),
    size: ci('spacesize', 'sizeofspace', 'shopsize', 'size', 'area'), floor: ci('floor', 'whichfloor'), launch: ci('targetlaunch', 'launch', 'targetopening'),
    lang: ci('preferredlanguage', 'language'), notes: ci('notes', 'applicantnotes', 'notesfromapplicant', 'remarks', 'comments')
  };
  if (C.space >= 0 && C.space === C.size) C.space = -1;
  var out = [], seen = {};
  for (var r = hi + 1; r < aoa.length; r++) {
    var row = aoa[r];
    if (rowBlank(row)) continue;
    var idRaw = String(cell(row, C.id)).trim().toUpperCase();
    var name = String(cell(row, C.name)).trim();
    if (!idRaw && !name) continue;
    var id = idRaw || ('ROW-' + (r + 1));
    if (seen[id]) { seen[id]++; id = id + '#' + seen[id]; } else seen[id] = 1;
    var city = canonCity(cell(row, C.city));
    var pinRaw = String(cell(row, C.pin)).trim();
    var pin = pinRaw.replace(/\.0$/, '').replace(/\s/g, '');
    var spaceRaw = String(cell(row, C.space)).trim();
    var a = {
      id: id, row: r + 1, name: name || id, city: city, state: String(cell(row, C.state)).trim(),
      pin: pin, pinRaw: pinRaw, invest: lakh(cell(row, C.invest)), exp: num(cell(row, C.exp)),
      biz: String(cell(row, C.biz)).trim(), space: normSpace(spaceRaw), spaceRaw: spaceRaw,
      size: num(cell(row, C.size)), floor: normFloor(cell(row, C.floor)),
      launch: num(cell(row, C.launch)), lang: normLang(cell(row, C.lang)),
      langRaw: String(cell(row, C.lang)).trim(), notes: String(cell(row, C.notes)).trim(),
      sizeAssumed: false, withdrawn: false
    };
    a.templateExample = (id === 'APP-001' && /ravi kumar/i.test(name) && pin === '570001' && /diwali/i.test(a.notes));
    out.push(a);
  }
  return out;
}

function parseTerritories(aoa) {
  var hi = findHeaderRow(aoa, TER_KEYS);
  if (hi < 0) throw new Error('Could not find a "Territory ID" header row in the Territories sheet.');
  var ci = colFinder(aoa[hi]);
  var C = { id: ci.apply(null, TER_KEYS), city: ci('city', 'town'), state: ci('state'), pins: ci('pincodes', 'pincode', 'pins', 'pin'),
            tier: ci('citytier', 'tier'), slots: ci('openslots', 'slots', 'stores'), priority: ci('priority') };
  var out = [];
  for (var r = hi + 1; r < aoa.length; r++) {
    var row = aoa[r];
    if (rowBlank(row)) continue;
    var id = String(cell(row, C.id)).trim().toUpperCase();
    if (!id) continue;
    var city = canonCity(cell(row, C.city));
    var pins = (String(cell(row, C.pins)).match(/\d{6}/g) || []);
    var seen = {}; pins = pins.filter(function (p) { if (seen[p]) return false; seen[p] = 1; return true; });
    var t = {
      id: id, row: r + 1, city: city, state: String(cell(row, C.state)).trim(), pins: pins,
      tier: normTier(cell(row, C.tier), city), slots: Math.max(0, num(cell(row, C.slots)) || 0),
      priority: normPriority(cell(row, C.priority))
    };
    t.templateExample = (id === 'TER-01' && pins.join(',') === '570001,570002,570008' && t.slots === 3 && t.priority === 'High');
    out.push(t);
  }
  return out;
}

/* ------------------------------------------------------------------ */
/* Evaluation of a single applicant                                    */
/* ------------------------------------------------------------------ */
var RETAIL_RX = /(shop|store|retail|showroom|outlet|kirana|supermarket|\bmart\b|trading|trader|wholesale|garment|footwear|mobile|electronics|optical|eyewear|jewel|pharmacy|medical|stationery|boutique|sales|merchant|dealer|franchise|general store|provision)/i;

function buildContext(territories, stores, cfg, apps) {
  var pinToTer = {}, dupPins = [];
  territories.forEach(function (t) {
    t.pins.forEach(function (p) { if (pinToTer[p]) { if (dupPins.indexOf(p) < 0) dupPins.push(p); } else pinToTer[p] = t; });
  });
  var storeByPin = {}; stores.forEach(function (s) { storeByPin[s.pin] = s; });
  var cityHasTer = {}; territories.forEach(function (t) { cityHasTer[t.city] = true; });
  var nameCount = {};
  (apps || []).forEach(function (a) { if (a.withdrawn) return; var k = a.name.trim().toLowerCase(); nameCount[k] = (nameCount[k] || 0) + 1; });
  return { territories: territories, stores: stores, cfg: cfg, pinToTer: pinToTer, storeByPin: storeByPin,
           cityHasTer: cityHasTer, dupPins: dupPins, nameCount: nameCount };
}

function feasibleMonths(a, cfg) {
  var weeks = cfg.earliestWeeks + (a.space === 'Not yet identified' ? cfg.noSpaceExtraWeeks : 0);
  return weeks / 4.345;
}

function nearestStoreInfo(a, ctx) {
  var n = parseInt(a.pin, 10); if (isNaN(n)) return null;
  var best = null;
  ctx.stores.forEach(function (s) {
    if (s.city !== a.city) return;
    var d = Math.abs(parseInt(s.pin, 10) - n);
    if (!best || d < best.d) best = { store: s, d: d };
  });
  return best;
}

function evaluateApp(a, ctx) {
  var cfg = ctx.cfg, W = cfg.weights, issues = [];
  function add(code, level, title, detail, extra) {
    var it = { code: code, level: level, title: title, detail: detail };
    if (extra) for (var k in extra) it[k] = extra[k];
    issues.push(it);
  }
  var city = CITIES[a.city];
  var pin = a.pin;
  var validPin = /^\d{6}$/.test(pin || '');
  var ter = validPin ? (ctx.pinToTer[pin] || null) : null;
  var tier = ter ? ter.tier : (city ? city.tier : null);
  var floor = tier ? cfg.floors[tier] : null;

  /* ---- pin and territory ---- */
  if (!city) {
    if (!a.city) add('CITY_UNKNOWN', 'hold', 'City missing', 'The city was left blank.');
    else add('CITY_UNKNOWN', 'hold', 'City not recognised', '“' + a.city + '” is not one of the cities the brand serves.');
  }
  if (!validPin) {
    if (!a.pinRaw) add('PIN_BAD', 'hold', 'Pin code missing', 'The pin code was left blank.');
    else add('PIN_BAD', 'hold', 'Invalid pin code', 'Pin code “' + a.pinRaw + '” is not a 6-digit number.');
  } else if (city && pin.indexOf(city.prefix) !== 0) {
    add('PIN_MISMATCH', 'hold', 'Pin code and city do not match',
        pin + ' does not start with ' + city.prefix + ', the prefix for ' + a.city + '. One of the two is wrong.');
  } else {
    var st = ctx.storeByPin[pin];
    if (st) {
      add('PIN_HAS_STORE', 'hold', 'A store is already open in this pin code',
          st.id + ' (opened ' + st.year + ') already operates in ' + pin + '. The brand never opens two stores in one pin code.', { store: st });
    } else if (!ter) {
      if (!ctx.cityHasTer[a.city]) {
        add('NO_TERRITORY', 'reject', 'No expansion territory in this city',
            'The brand has no open territory in ' + a.city + ' right now.');
      } else {
        add('PIN_OUTSIDE', 'hold', 'Pin code is outside the expansion territories',
            pin + ' is not covered by any territory the brand wants to grow in within ' + a.city + '.');
      }
    }
  }

  /* ---- investment ---- */
  var ratio = null;
  if (a.invest === null || a.invest <= 0) {
    add('INVEST_MISSING', 'hold', 'Investment amount missing', 'No usable investment figure was given.');
  } else if (floor) {
    ratio = a.invest / floor;
    if (ratio < cfg.rejectRatio) {
      add('INVEST_LOW', 'reject', 'Investment far below what a store here needs',
          'Rs ' + a.invest + ' lakh is ' + Math.round(ratio * 100) + '% of the Rs ' + floor + ' lakh floor for a ' + tier + ' city (cut-off ' + Math.round(cfg.rejectRatio * 100) + '%).', { need: floor });
    } else if (ratio < 1) {
      add('INVEST_GAP', 'hold', 'Investment slightly below the floor',
          'Rs ' + a.invest + ' lakh against a Rs ' + floor + ' lakh floor for a ' + tier + ' city. A co-investor or proof of extra funds would close the gap.', { need: floor });
    }
  }

  /* ---- space ---- */
  var hasSpace = a.space === 'Owned' || a.space === 'Rented';
  if (!hasSpace) {
    add('NO_SPACE', 'hold', 'No shop space identified yet', 'The applicant has not yet found a space, so the store cannot be fitted out.');
  } else {
    if (a.size === null && !a.sizeAssumed) add('SIZE_MISSING', 'hold', 'Space size missing', 'A ' + a.space.toLowerCase() + ' space is stated but no size was given.');
    else if (a.size !== null && a.size < cfg.minSpace) add('SIZE_SMALL', 'hold', 'Space too small',
        a.size + ' sq ft is under the ' + cfg.minSpace + ' sq ft minimum for the store format.');
    if (a.floor === 'Upper') add('FLOOR_UPPER', 'hold', 'Upper-floor space', 'Upper floors get too little walk-in footfall; ground floor or a mall unit is needed.');
  }

  /* ---- contradictions between the form and the free-text notes ---- */
  var notesAll = (a.notes || '').toLowerCase();
  var notes = a.notesSuperseded ? '' : notesAll;   // once Ops records new information, old free-text no longer counts
  var claimsSpace = /\b(already|have|has|got|own|owns|owned|secured|signed|finalised|finalized)\b[^.]{0,40}\b(shop|space|premises|property|unit|showroom)\b/.test(notes) || /lease (is )?signed|rent agreement|agreement signed/.test(notes);
  var deniesSpace = /\b(no shop|no space|not yet|yet to|haven't found|havent found|don't have|dont have|looking for|searching for|will (rent|find|take|identify|look)|once approved|after approval)\b/.test(notes);
  if (a.space === 'Not yet identified' && claimsSpace && !deniesSpace) {
    add('NOTES_CONFLICT', 'hold', 'Notes contradict the form',
        'The form says no space has been identified, but the notes say the applicant already has one. Which is right needs confirming.');
  } else if (hasSpace && deniesSpace && !claimsSpace) {
    add('NOTES_CONFLICT', 'hold', 'Notes contradict the form',
        'The form says a space is ' + a.space.toLowerCase() + ', but the notes say the applicant is still looking.');
  } else if (a.floor === 'Upper' && /ground[\s-]?floor/.test(notes) && !/looking|searching|prefer|want|need/.test(notes)) {
    add('NOTES_CONFLICT', 'hold', 'Notes contradict the form', 'The form says upper floor, but the notes mention a ground-floor shop.');
  }

  /* ---- soft flags: do not block, but lower confidence ---- */
  if (a.exp === 0 && /\b(run|runs|running|owner|owns|own|manage|manages|managing|operate|operates)\b[^.]{0,30}\b(shop|store|retail|showroom|outlet)/i.test(a.biz)) {
    add('EXP_CONFLICT', 'soft', 'Experience looks understated', 'Retail experience is 0 years but the business description says the applicant runs a shop.');
  } else if (a.exp !== null && a.exp >= 5 && /student|fresher|homemaker|unemployed/i.test(a.biz)) {
    add('EXP_CONFLICT', 'soft', 'Experience looks overstated', a.exp + ' years of retail experience but the business description says "' + a.biz + '".');
  }
  if (/\b(loan|bank|finance|mudra|borrow|subsidy|sanction)/.test(notesAll)) {
    add('LOAN', 'soft', 'Funding depends on a loan', 'The notes suggest part of the investment depends on a loan that may not be sanctioned yet.');
  }
  var nk = a.name.trim().toLowerCase();
  if (ctx.nameCount[nk] > 1) add('DUP_APPLICANT', 'soft', 'Same name on several applications', 'Another application carries the same applicant name; possible duplicate.');
  var fm = feasibleMonths(a, cfg);
  if (a.launch !== null && a.launch < fm - 0.01) {
    add('LAUNCH_SOON', 'info', 'Target launch is earlier than realistic',
        'Target is ' + a.launch + ' month(s); the earliest realistic opening is about ' + fm.toFixed(1) + ' months.');
  }
  if (!a.lang) add('LANG_MISSING', 'info', 'Training language missing', 'Defaulting to English until the applicant confirms.');

  /* ---- level ---- */
  var level = 'ready';
  if (issues.some(function (i) { return i.level === 'hold'; })) level = 'hold';
  if (issues.some(function (i) { return i.level === 'reject'; })) level = 'reject';

  /* ---- score (0-100) ---- */
  var parts = {}, softCount = issues.filter(function (i) { return i.level === 'soft'; }).length;
  var capF = 0, capNote = 'no figure';
  if (ratio !== null) {
    capF = ratio >= 1 ? 0.4 + 0.6 * clamp((ratio - 1) / 0.5, 0, 1) : 0.4 * clamp((ratio - cfg.rejectRatio) / (1 - cfg.rejectRatio), 0, 1);
    capNote = 'Rs ' + a.invest + ' lakh vs Rs ' + floor + ' lakh floor (' + Math.round(ratio * 100) + '%)';
  }
  parts.capital = { pts: W.capital * capF, max: W.capital, label: 'Capital', note: capNote };

  var yrs = a.exp === null ? 0 : a.exp;
  var retailBiz = RETAIL_RX.test(a.biz || '');
  var expF = (0.2 + 0.8 * Math.min(yrs, 5) / 5) * (retailBiz ? 1 : 0.85);
  parts.experience = { pts: W.experience * expF, max: W.experience, label: 'Experience',
    note: yrs + ' yr' + (yrs === 1 ? '' : 's') + (retailBiz ? ', retail background' : ', non-retail background') };

  var spF = 0, spNote = 'no space';
  if (hasSpace) {
    var ownF = a.space === 'Owned' ? 1 : 0.85;
    var sz = a.size, szF;
    if (sz === null) szF = 0.7;
    else if (sz >= cfg.idealMin && sz <= cfg.idealMax) szF = 1;
    else if (sz > cfg.idealMax) szF = 0.9;
    else szF = 0.7;
    var flF = a.floor === 'Ground' ? 1 : a.floor === 'Mall unit' ? 0.9 : a.floor === 'Upper' ? 0.5 : 0.6;
    spF = ownF * szF * flF;
    spNote = a.space + ', ' + (sz === null ? 'size to confirm' : sz + ' sq ft') + ', ' + (a.floor === 'Not known' ? 'floor to confirm' : a.floor.toLowerCase());
  }
  parts.space = { pts: W.space * spF, max: W.space, label: 'Space', note: spNote };

  var tF = 0.6, tNote = 'no target given';
  if (a.launch !== null) {
    tF = a.launch >= fm ? 1 : Math.max(0, 1 - (fm - a.launch) / fm);
    tNote = 'target ' + a.launch + ' mo vs earliest ' + fm.toFixed(1) + ' mo';
  }
  parts.timeline = { pts: W.timeline * tF, max: W.timeline, label: 'Timeline', note: tNote };

  var ns = nearestStoreInfo(a, ctx), cF = 1, cNote = 'no store in this city yet', risk = 'Low';
  if (ns) {
    if (ns.d === 0) { cF = 0; risk = 'Blocked'; }
    else if (ns.d <= cfg.cannibNear) { cF = 0; risk = 'High'; }
    else if (ns.d <= cfg.cannibMid) { cF = 0.5; risk = 'Medium'; }
    cNote = 'nearest store ' + ns.store.id + ' is ' + ns.d + ' pin numbers away';
  }
  parts.cannibal = { pts: W.cannibal * cF, max: W.cannibal, label: 'Spacing', note: cNote, risk: risk };

  var dF = clamp(1 - 0.25 * softCount, 0, 1);
  parts.data = { pts: W.data * dF, max: W.data, label: 'Data confidence', note: softCount ? softCount + ' soft flag' + (softCount > 1 ? 's' : '') : 'clean' };

  var score = 0; for (var k in parts) score += parts[k].pts;

  /* ---- conditions attached to an approval ---- */
  var cond = [];
  if (a.sizeAssumed) cond.push('Confirm the space is at least ' + cfg.minSpace + ' sq ft before the agreement is signed');
  if (hasSpace && a.floor === 'Not known') cond.push('Confirm the floor (ground floor or mall unit)');
  if (issues.some(function (i) { return i.code === 'LOAN'; })) cond.push('Show the loan sanction letter as proof of funds');
  if (issues.some(function (i) { return i.code === 'EXP_CONFLICT'; })) cond.push('Verify past retail experience during KYC');
  if (issues.some(function (i) { return i.code === 'DUP_APPLICANT'; })) cond.push('Confirm this is the only application from this person');
  if (a.space === 'Rented') cond.push('Registered lease for the space');

  return { level: level, issues: issues, tier: tier, ter: ter, floor: floor, ratio: ratio, parts: parts, score: r1(score), conditions: cond, feasible: fm };
}

/* ------------------------------------------------------------------ */
/* Allocation: one store per pin, slots per territory                  */
/* ------------------------------------------------------------------ */
function cmp(A, B) {
  return ((B.forced ? 1 : 0) - (A.forced ? 1 : 0)) || (B.ev.score - A.ev.score) || ((B.a.exp || 0) - (A.a.exp || 0)) || ((B.a.invest || 0) - (A.a.invest || 0)) || (A.a.id < B.a.id ? -1 : 1);
}

function core(apps, territories, stores, cfg) {
  var live = apps.filter(function (a) { return !a.withdrawn; });
  var ctx = buildContext(territories, stores, cfg, live);
  var evals = {}, res = {};
  live.forEach(function (a) { evals[a.id] = evaluateApp(a, ctx); });

  // Human overrides (a.override = { to, reason, at }), oldest first. An approval override goes first in allocation,
  // but is refused if it would put a store on a pin with a store, outside every territory, on a pin another
  // override already holds, or into a territory whose slots are all held by overrides.
  var ovr = {}, heldPins = {}, heldSlots = {};
  live.filter(function (a) { return a.override; }).sort(function (a, b) { return (a.override.at || 0) - (b.override.at || 0); }).forEach(function (a) {
    var o = a.override, ev = evals[a.id], why = '';
    if (o.to === 'Approve') {
      if (ev.level === 'reject' && ev.issues.some(function (i) { return i.code === 'NO_TERRITORY'; })) why = 'the brand has no territory in ' + a.city;
      else if (!/^\d{6}$/.test(a.pin || '') || !ev.ter) why = 'pin ' + (a.pin || '(blank)') + ' is not in any expansion territory, so there is no slot to give';
      else if (ctx.storeByPin[a.pin]) why = ctx.storeByPin[a.pin].id + ' already operates in pin ' + a.pin + ', and the brand never opens two stores in one pin code';
      else if (heldPins[a.pin]) why = heldPins[a.pin] + ' already holds pin ' + a.pin + ' by override, and the brand never opens two stores in one pin code';
      else if ((heldSlots[ev.ter.id] || 0) >= ev.ter.slots) why = 'every open slot in ' + ev.ter.id + ' (' + ev.ter.slots + ') is already held by an override';
      if (!why) { heldPins[a.pin] = a.id; heldSlots[ev.ter.id] = (heldSlots[ev.ter.id] || 0) + 1; }
    }
    ovr[a.id] = { to: o.to, reason: o.reason || '', at: o.at || 0, applied: !why, refused: why };
  });
  var forcedTo = function (id) { return ovr[id] && ovr[id].applied ? ovr[id].to : null; };

  var ready = live.filter(function (a) { var f = forcedTo(a.id); return f ? f === 'Approve' : evals[a.id].level === 'ready'; })
    .map(function (a) { return { a: a, ev: evals[a.id], forced: forcedTo(a.id) === 'Approve' }; });
  var byPin = {};
  ready.forEach(function (x) { (byPin[x.a.pin] = byPin[x.a.pin] || []).push(x); });
  var pinWinners = [];
  Object.keys(byPin).forEach(function (pin) {
    var g = byPin[pin].sort(cmp);
    g.forEach(function (x, i) {
      x.rankPin = i + 1; x.pinN = g.length; x.pinGroup = g;
    });
    pinWinners.push(g[0]);
  });
  var byTer = {};
  pinWinners.forEach(function (x) { (byTer[x.ev.ter.id] = byTer[x.ev.ter.id] || []).push(x); });
  var outcome = {};
  Object.keys(byTer).forEach(function (tid) {
    var g = byTer[tid].sort(cmp), t = g[0].ev.ter;
    g.forEach(function (x, i) {
      x.rankTer = i + 1; x.terN = g.length;
      if (i < t.slots) outcome[x.a.id] = { o: 'Approve', winner: true };
      else outcome[x.a.id] = { o: 'Waitlist', reason: 'territory_full' };
    });
    g._slots = t.slots;
    byTer[tid] = g;
  });
  ready.forEach(function (x) {
    if (x.rankPin > 1) outcome[x.a.id] = { o: 'Waitlist', reason: 'pin_lost', winner: x.pinGroup[0].a.id };
  });

  var approvedByTer = {};
  Object.keys(outcome).forEach(function (id) { if (outcome[id].o === 'Approve') { var tid = evals[id].ter.id; approvedByTer[tid] = (approvedByTer[tid] || 0) + 1; } });
  var approvedPins = {};
  live.forEach(function (a) { if (outcome[a.id] && outcome[a.id].o === 'Approve') approvedPins[a.pin] = a.id; });

  live.forEach(function (a) {
    var ev = evals[a.id], oc = outcome[a.id];
    var r = { id: a.id, score: ev.score, parts: ev.parts, issues: ev.issues, tier: ev.tier, ter: ev.ter, conditions: ev.conditions, feasible: ev.feasible };
    var f = forcedTo(a.id);
    if (ovr[a.id]) r.override = ovr[a.id];
    if (f && f !== 'Approve') { r.outcome = f; if (f === 'Waitlist') r.waitReason = 'override'; }
    else if (f === 'Approve') {
      r.outcome = oc.o;
      ev.issues.filter(function (i) { return i.level === 'hold' || i.level === 'reject'; }).forEach(function (i) { r.conditions = r.conditions.concat('Resolve before signing (approved by override): ' + i.title.toLowerCase()); });
    }
    else if (ev.level === 'reject') r.outcome = 'Reject';
    else if (ev.level === 'hold') r.outcome = 'Hold';
    else r.outcome = oc.o;
    if ((r.outcome === 'Approve' || r.outcome === 'Waitlist') && outcome[a.id]) {
      var x = ready.filter(function (y) { return y.a.id === a.id; })[0];
      r.rankPin = x.rankPin; r.pinN = x.pinN; r.rankTer = x.rankTer || null; r.terN = x.terN || null;
      r.pinRivals = x.pinGroup.filter(function (y) { return y.a.id !== a.id; }).map(function (y) { return y.a.id; });
      if (oc.reason) { r.waitReason = oc.reason; r.winner = oc.winner || null; }
      if (r.outcome === 'Approve') {
        var next = null;
        if (x.pinGroup.length > 1) next = x.pinGroup[1];
        else {
          var g = byTer[ev.ter.id], t = ev.ter;
          if (g.length > t.slots) next = g[t.slots];
        }
        if (next) { r.nextRival = next.a.id; r.margin = r1(ev.score - next.ev.score); }
      } else if (oc.reason === 'territory_full') {
        var gg = byTer[ev.ter.id]; r.beatenBy = gg.slice(0, ev.ter.slots).map(function (y) { return y.a.id; });
        r.margin = r1(gg[ev.ter.slots - 1] ? gg[ev.ter.slots - 1].ev.score - ev.score : 0);
      } else {
        var w = x.pinGroup[0]; r.margin = r1(w.ev.score - ev.score);
      }
    }
    res[a.id] = r;
  });
  return { ctx: ctx, evals: evals, res: res, ready: ready, byTer: byTer, approvedByTer: approvedByTer, approvedPins: approvedPins, live: live };
}

function freePins(core0, city, exceptApp) {
  var out = [];
  core0.ctx.territories.forEach(function (t) {
    if (t.city !== city) return;
    var left = t.slots - (core0.approvedByTer[t.id] || 0);
    if (left <= 0) return;
    t.pins.forEach(function (p) {
      if (core0.ctx.storeByPin[p]) return;
      if (core0.approvedPins[p]) return;
      var contested = core0.ready.some(function (x) { return x.a.pin === p && (!exceptApp || x.a.id !== exceptApp); });
      out.push({ pin: p, ter: t.id, priority: t.priority, contested: contested, left: left });
    });
  });
  var pr = { High: 0, Medium: 1, Low: 2 };
  out.sort(function (a, b) { return (a.contested - b.contested) || (pr[a.priority] - pr[b.priority]) || (a.pin < b.pin ? -1 : 1); });
  return out;
}

function simulateFixed(a, core0, apps, territories, stores, cfg) {
  var ev = core0.evals[a.id], b = clone(a), fixes = [], possible = true, why = '';
  var fp = freePins(core0, a.city, a.id);
  ev.issues.forEach(function (i) {
    switch (i.code) {
      case 'PIN_HAS_STORE': case 'PIN_OUTSIDE':
        if (fp.length) { b.pin = fp[0].pin; fixes.push('Take free pin ' + fp[0].pin + ' in ' + fp[0].ter); } else { possible = false; why = 'no_free_pin'; }
        break;
      case 'PIN_MISMATCH': case 'PIN_BAD': case 'CITY_UNKNOWN': possible = false; why = 'pin_unknown'; break;
      case 'NO_SPACE': b.space = 'Rented'; b.size = cfg.idealMin; b.floor = 'Ground'; b.sizeAssumed = false; b.notesSuperseded = true; fixes.push('Find a rented ground-floor space of about ' + cfg.idealMin + ' sq ft'); break;
      case 'SIZE_MISSING': b.size = cfg.idealMin; fixes.push('Confirm a space of at least ' + cfg.idealMin + ' sq ft'); break;
      case 'SIZE_SMALL': b.size = cfg.idealMin; fixes.push('Move to a space of at least ' + cfg.idealMin + ' sq ft'); break;
      case 'FLOOR_UPPER': b.floor = 'Ground'; fixes.push('Move to a ground-floor or mall space'); break;
      case 'INVEST_GAP': case 'INVEST_MISSING': b.invest = i.need || ev.floor; fixes.push('Show Rs ' + (i.need || ev.floor) + ' lakh of investable funds'); break;
      case 'NOTES_CONFLICT': b.notesSuperseded = true; fixes.push('Clear up the contradiction between notes and form'); break;
    }
  });
  if (!possible || ev.issues.some(function (i) { return i.level === 'reject'; })) return { possible: false, why: why, fixes: fixes };
  var apps2 = apps.map(function (x) { return x.id === a.id ? b : x; });
  var c2 = core(apps2, territories, stores, cfg), r2 = c2.res[a.id];
  return { possible: true, fixes: fixes, outcome: r2.outcome, rankPin: r2.rankPin, pinN: r2.pinN, score: r2.score, pin: b.pin,
           terId: r2.ter ? r2.ter.id : null, winner: r2.winner || null, beatenBy: r2.beatenBy || null, stillHold: r2.outcome === 'Hold' };
}

function run(apps, territories, stores, cfg) {
  var c = core(apps, territories, stores, cfg);
  Object.keys(c.res).forEach(function (id) {
    var r = c.res[id], a = apps.filter(function (x) { return x.id === id; })[0];
    if (r.outcome === 'Hold') {
      r.ifFixed = simulateFixed(a, c, apps, territories, stores, cfg);
      var pinIssue = r.issues.filter(function (i) { return i.code === 'PIN_HAS_STORE' || i.code === 'PIN_OUTSIDE'; })[0];
      if (pinIssue) r.alternatives = freePins(c, a.city, a.id).slice(0, 4);
    } else if (r.outcome === 'Waitlist') {
      r.alternatives = freePins(c, a.city, a.id).filter(function (p) { return p.pin !== a.pin; }).slice(0, 3);
    }
  });
  c.cfg = cfg;
  return c;
}

/* ------------------------------------------------------------------ */
/* Plain-language explanation of a decision                            */
/* ------------------------------------------------------------------ */
function strengths(r) {
  var arr = Object.keys(r.parts).map(function (k) { return { k: k, f: r.parts[k].max ? r.parts[k].pts / r.parts[k].max : 0, p: r.parts[k] }; });
  arr.sort(function (a, b) { return b.f - a.f; });
  return arr;
}

function explain(r, a, state) {
  var cfg = state.cfg, out = { headline: '', lines: [], next: [] };
  var t = r.ter, ov = r.override;
  var OVL = { Approve: 'approval', Waitlist: 'waitlist', Hold: 'hold', Reject: 'rejection' };
  if (ov && ov.applied && ov.to !== 'Approve') {
    out.headline = { Waitlist: 'Waitlisted', Hold: 'On hold', Reject: 'Not taken forward' }[ov.to] + ' by override';
    out.lines.push('The expansion team overrode the standard decision. Reason given: ' + (ov.reason || 'none') + '.');
    r.issues.filter(function (i) { return i.level !== 'info'; }).forEach(function (i) { out.lines.push('Note: ' + i.detail); });
    out.next.push('Remove the override to return to the standard decision.');
    out.short = out.headline + ': ' + (ov.reason || 'no reason given');
    return out;
  }
  if (r.outcome === 'Approve') {
    out.headline = (ov && ov.applied ? 'Approved by override' : 'Approved') + ' for pin ' + a.pin + (t ? ' in ' + t.id + ' (' + a.city + ', ' + t.tier + ', ' + t.priority + ' priority)' : '');
    var st = strengths(r).slice(0, 2).map(function (s) { return s.p.label.toLowerCase() + ' (' + s.p.note + ')'; });
    out.lines.push('Score ' + r.score + ' out of 100. Strongest points: ' + st.join('; ') + '.');
    if (r.pinN > 1) out.lines.push('Won pin ' + a.pin + ' against ' + r.pinRivals.join(', ') + (r.margin < 0 ? ' by override.' : r.margin !== undefined ? ' by ' + r.margin + ' points.' : '.'));
    if (r.terN) out.lines.push('Took one of ' + t.slots + ' open slot' + (t.slots === 1 ? '' : 's') + ' in ' + t.id + (r.nextRival ? '; the next in line is ' + r.nextRival + (r.margin < 0 ? '.' : ' (' + r.margin + ' points behind).') : '.'));
    if (r.conditions.length) out.lines.push('Conditions to clear: ' + r.conditions.join('; ') + '.');
  } else if (r.outcome === 'Waitlist') {
    out.headline = 'Eligible, but waitlisted';
    if (r.waitReason === 'pin_lost') {
      out.lines.push('Scores ' + r.score + ', but pin ' + a.pin + ' goes to ' + r.winner + (r.margin < 0 ? ' (approved by override)' : ' (' + r.margin + ' points ahead)') + '. The brand opens one store per pin code.');
      out.next.push('Moves up if ' + r.winner + ' drops out or fails verification.');
    } else {
      out.lines.push('Best applicant for pin ' + a.pin + ' (score ' + r.score + '), but ' + t.id + ' has only ' + t.slots + ' open slot' + (t.slots === 1 ? '' : 's') + ', taken by ' + (r.beatenBy || []).join(', ') + (r.margin < 0 ? ', at least one by override.' : ' with higher scores' + (r.margin ? ' (' + r.margin + ' points ahead at the cut-off).' : '.')));
      out.next.push('Promoted if a slot opens in ' + t.id + ' or one of those applicants drops out.');
    }
    if (r.alternatives && r.alternatives.length) out.next.push('Open alternative' + (r.alternatives.length > 1 ? 's' : '') + ' in ' + a.city + ': ' + r.alternatives.map(function (p) { return p.pin + ' (' + p.ter + ')'; }).join(', ') + ' (needs a space there).');
  } else if (r.outcome === 'Hold') {
    var holds = r.issues.filter(function (i) { return i.level === 'hold'; });
    out.headline = 'On hold: ' + holds.map(function (i) { return i.title.toLowerCase(); }).join('; ');
    holds.forEach(function (i) { out.lines.push(i.detail); });
    if (r.ifFixed) {
      var f = r.ifFixed;
      if (!f.possible && f.why === 'no_free_pin') out.next.push('No open pin is left in ' + a.city + ': every slot in its territories is already taken, so a re-targeted application would join the waitlist.');
      else if (!f.possible) out.next.push('Cannot be re-scored until the pin code or city is corrected.');
      else {
        out.next.push('To move forward: ' + f.fixes.join('; ') + '.');
        if (f.outcome === 'Approve') out.next.push('If that happens, the application would be approved (score ' + f.score + (f.pinN > 1 ? ', ranked #' + f.rankPin + ' of ' + f.pinN + ' for pin ' + f.pin : '') + ').');
        else if (f.outcome === 'Waitlist') out.next.push('If that happens, it would still be waitlisted (score ' + f.score + (f.winner ? ', behind ' + f.winner : f.beatenBy ? ', behind ' + f.beatenBy.join(', ') : '') + ').');
        else out.next.push('Even then it would remain on hold for other reasons.');
      }
    }
    if (r.alternatives && r.alternatives.length) out.next.push('Open pins in ' + a.city + ': ' + r.alternatives.map(function (p) { return p.pin + ' (' + p.ter + ')'; }).join(', ') + '.');
  } else if (r.outcome === 'Reject') {
    var rj = r.issues.filter(function (i) { return i.level === 'reject'; });
    out.headline = 'Not taken forward: ' + rj.map(function (i) { return i.title.toLowerCase(); }).join('; ');
    rj.forEach(function (i) { out.lines.push(i.detail); });
    out.next.push('Keep on file and re-contact if the situation changes (for example, more capital or a new territory opening).');
  }
  r.issues.filter(function (i) { return i.level === 'soft' || i.level === 'info'; }).forEach(function (i) { out.lines.push('Note: ' + i.detail); });
  if (ov && ov.applied) out.lines.unshift('The expansion team approved this by override. Reason given: ' + (ov.reason || 'none') + '. It goes first for pin ' + a.pin + ' and a slot in ' + (t ? t.id : 'its territory') + '.');
  if (ov && !ov.applied) out.lines.unshift('An override to ' + OVL[ov.to] + ' was refused: ' + ov.refused + '. The standard decision stands.');
  if (r.outcome === 'Approve') {
    out.short = (ov && ov.applied ? 'By override: ' : '') + 'Takes pin ' + a.pin + (t ? ' in ' + t.id : '') + (r.pinN > 1 ? ', ahead of ' + r.pinRivals.join(', ') + (r.margin < 0 ? '' : ' by ' + r.margin) : r.nextRival && r.margin >= 0 ? ', ' + r.margin + ' ahead of ' + r.nextRival : '') + (r.conditions.length ? '; ' + r.conditions.length + ' condition' + (r.conditions.length > 1 ? 's' : '') : '');
  } else if (r.outcome === 'Waitlist') {
    out.short = r.waitReason === 'pin_lost' ? 'Pin ' + a.pin + ' goes to ' + r.winner + (r.margin < 0 ? ' by override' : ' (' + r.margin + ' points ahead)') : t.id + ' is full' + (r.margin < 0 ? ' (override)' : '; ' + r.margin + ' points under the cut-off');
  } else out.short = out.headline;
  return out;
}

function mentorStore(a, ctx) {

function onboardingPlan(r, a, state) {

/* modules\whatif.js */
// Confidence on every decision, fragile decisions (flip when a threshold moves 10%), and side-by-side scenarios.
// Pure functions of the app state S ({ apps, ters, cfg, run }).
(function (root) {
'use strict';
var E = root.Engine || require('../engine.js');

// Thresholds the brand sets. Each is nudged 10% down and up to find fragile decisions.
var THRESHOLDS = [
  { path: 'floors.Tier 1', label: 'Minimum investment, Tier 1', unit: 'lakh' },
  { path: 'floors.Tier 2', label: 'Minimum investment, Tier 2', unit: 'lakh' },
  { path: 'floors.Tier 3', label: 'Minimum investment, Tier 3', unit: 'lakh' },
  { path: 'rejectRatio', label: 'Reject below share of the floor', unit: '%', pct: true },
  { path: 'minSpace', label: 'Minimum space', unit: 'sq ft' },
  { path: 'idealMin', label: 'Ideal space from', unit: 'sq ft' },
  { path: 'idealMax', label: 'Ideal space up to', unit: 'sq ft' },
  { path: 'earliestWeeks', label: 'Earliest opening', unit: 'weeks' },
  { path: 'cannibNear', label: 'High spacing risk within', unit: 'pin numbers' },
  { path: 'cannibMid', label: 'Medium spacing risk within', unit: 'pin numbers' }

var NUDGE = 0.1;
// Display cut-offs for confidence: points clear of the next rival
var CONF = { high: 10, medium: 3 };

function get(o, path) { return path.split('.').reduce(function (x, k) { return x[k]; }, o); }

function fragile(S) {

    else { level = 'high'; why.push(r.outcome === 'Hold' ? 'Held on facts in the form, not on a close score' : 'Clear-cut on the rules'); }
    var soft = r.issues.filter(function (i) { return i.level === 'soft'; });
    if (soft.length) { level = down[level]; why.push(soft.length + ' data flag' + (soft.length > 1 ? 's' : '') + ': ' + soft.map(function (i) { return i.title.toLowerCase(); }).join('; ')); }
    if (frag[a.id]) { level = 'low'; var f = frag[a.id][0]; why.push('Flips to ' + f.now + ' if ' + f.label.charAt(0).toLowerCase() + f.label.slice(1) + ' moves from ' + f.from + ' to ' + f.to + (frag[a.id].length > 1 ? ' (and ' + (frag[a.id].length - 1) + ' other change' + (frag[a.id].length > 2 ? 's' : '') + ')' : '')); }
    out[a.id] = { level: level, why: why };

/* ---------- scenarios ---------- */
// changes: [{ kind: 'cfg', path, value } | { kind: 'slots', ter, value }] (value is the new number; rejectRatio as a fraction)

    if (c.kind === 'cfg') set(cfg, c.path, c.value);

  var count = function (m) { var c = { Approve: 0, Waitlist: 0, Hold: 0, Reject: 0 }; Object.keys(m).forEach(function (k) { c[m[k]]++; }); return c; };

    var a = S.apps.filter(function (x) { return x.id === id; })[0];
    return { id: id, name: a.name, from: b[id], to: a2[id] };

<script>

function load(appsAoA, tersAoA, label) {

function firstOf(o) { var a = S.apps.filter(function (x) { return !x.withdrawn && S.run.res[x.id] && S.run.res[x.id].outcome === o; })[0]; return a ? a.id : ''; }

/* Understanding questions and new information                         */
/* ------------------------------------------------------------------ */
var NUMW = { one: 1, two: 2, three: 3, four: 4, five: 5, another: 1, a: 1 };

function findIds(text) {
  var ids = [], seen = {};
  (text.match(/\bapp[-\s_]?0*(\d{1,4})\b/gi) || []).forEach(function (m) {
    var n = parseInt(m.replace(/\D/g, ''), 10);
    var a = S.apps.filter(function (x) { return parseInt(x.id.replace(/\D.*$/, '').replace(/\D/g, ''), 10) === n || x.id === 'APP-' + E.pad(n, 3); })[0];
    var id = a ? a.id : 'APP-' + E.pad(n, 3);
    if (!seen[id]) { seen[id] = 1; ids.push(id); }
  });
  if (!ids.length) {
    var low = text.toLowerCase();
    S.apps.forEach(function (a) {
      var first = a.name.toLowerCase().split(/\s+/)[0];
      if (first.length >= 4 && new RegExp('\\b' + first.replace(/[^a-z]/g, '') + '\\b').test(low) && !seen[a.id]) { seen[a.id] = 1; ids.push(a.id); }
    });
  }
  return ids;
}
function findTers(text) {
  var out = [];
  (text.match(/\bter[-\s_]?0*(\d{1,3})\b/gi) || []).forEach(function (m) {
    var n = parseInt(m.replace(/\D/g, ''), 10);
    var t = S.ters.filter(function (x) { return parseInt(x.id.replace(/\D/g, ''), 10) === n; })[0];
    if (t && out.indexOf(t.id) < 0) out.push(t.id);
  });
  return out;
}

function parseFields(low) {
  var f = {};
  var spaceWord = /(space|shop|premises|property|store|unit|showroom|outlet|place|location|building)/.test(low);
  var foundVerb = /(found|got|secured|signed|identified|finali[sz]ed|has (a|the)|have (a|the)|taken|leased|rented|bought|acquired|booked|arranged|moved|shifted|switched|now (has|have|in))/.test(low);
  if (spaceWord && foundVerb) {
    f.spaceFound = true;
    if (/\bown(ed)?\b|bought|purchased/.test(low)) f.space = 'Owned';
    else if (/rent|lease/.test(low)) f.space = 'Rented';
  }
  if (/ground[\s-]?floor|\bground\b/.test(low)) f.floor = 'Ground';
  else if (/\bmall\b/.test(low)) f.floor = 'Mall unit';
  else if (/(upper floor|first floor|1st floor|second floor|2nd floor|terrace)/.test(low)) f.floor = 'Upper';
  var sz = low.match(/(\d{2,4})\s*(sq\.?\s?ft|sqft|square\s?feet|sq\s?feet|sft)/); if (sz) f.size = +sz[1];
  var cr = low.match(/(\d+(?:\.\d+)?)\s*(crore|cr)\b/);
  var lk = low.match(/(\d+(?:\.\d+)?)\s*(lakh|lakhs|lac|lacs|l)\b/);
  if (/(invest|capital|fund|budget|money|raise|put in|afford)/.test(low)) {
    if (cr) f.invest = Math.round(parseFloat(cr[1]) * 100);
    else if (lk) f.invest = parseFloat(lk[1]);
    else { var m2 = low.match(/(?:invest\w*|capital|budget|funds?)\D{0,25}(\d+(?:\.\d+)?)/); if (m2) { var v = parseFloat(m2[1]); f.invest = v > 1000 ? v / 100000 : v; } }
  }
  var ex = low.match(/(\d+(?:\.\d+)?)\s*\+?\s*(?:years?|yrs?)/);
  if (ex && /(experience|worked|ran|runs|run a|managed|retail)/.test(low)) f.exp = parseFloat(ex[1]);
  var ln = low.match(/(\d+(?:\.\d+)?)\s*months?/);
  if (ln && /(launch|open|start|ready)/.test(low)) f.launch = parseFloat(ln[1]);
  var pn = low.match(/\b(\d{6})\b/); if (pn) f.pin = pn[1];
  if (/(prefer|language|training in|speaks|switch to)/.test(low)) { if (/kannada/.test(low)) f.lang = 'Kannada'; else if (/hindi/.test(low)) f.lang = 'Hindi'; else if (/english/.test(low)) f.lang = 'English'; }
  if (/(withdr|drop(ped)? out|dropping out|no longer interested|pulled out|backed out|not interested|cancel)/.test(low)) f.withdraw = true;
  return f;
}

function parseTerritoryChange(low) {
  var f = {};
  var sl = low.match(/(\d+|one|two|three|four|five|another)\s*(?:more|extra|additional|new)?\s*slots?/) || low.match(/slots?\D{0,12}(\d+)/);
  if (sl) {
    var n = isNaN(+sl[1]) ? NUMW[sl[1]] : +sl[1];
    f.slots = n; f.add = /(more|extra|additional|another|add|new slot)/.test(low);
  }
  var pr = low.match(/(high|medium|low)\s*priority|priority\D{0,12}(high|medium|low)/);
  if (pr) f.priority = (pr[1] || pr[2]).replace(/^./, function (c) { return c.toUpperCase(); });
  return f;
}

function pushUndo() { S.undo.push({ apps: E.clone(S.apps), ters: E.clone(S.ters), cfg: E.clone(S.cfg) }); if (S.undo.length > 20) S.undo.shift(); }

function applyAppFields(a, f) {
  var did = [];
  if (f.withdraw) { a.withdrawn = true; did.push('withdrawn'); return did; }
  var spaceTouched = false;
  if (f.spaceFound || f.size !== undefined || f.floor !== undefined) {
    if (f.space) a.space = f.space;
    else if (a.space === 'Not yet identified') a.space = 'Rented';
    if (a.space !== 'Not yet identified' && f.spaceFound && !(a.space === 'Owned' || a.space === 'Rented')) a.space = 'Rented';
    if (f.size !== undefined) { a.size = f.size; a.sizeAssumed = false; did.push('space ' + f.size + ' sq ft'); }
    else if (a.size === null) { a.sizeAssumed = true; }
    if (f.floor) { a.floor = f.floor; did.push(f.floor.toLowerCase() + (f.floor === 'Mall unit' ? '' : ' floor')); }
    did.unshift(a.space.toLowerCase() + ' space');
    spaceTouched = true;
  }
  if (f.invest !== undefined) { a.invest = f.invest; did.push('investment Rs ' + f.invest + ' lakh'); }
  if (f.exp !== undefined) { a.exp = f.exp; did.push('experience ' + f.exp + ' years'); }
  if (f.launch !== undefined) { a.launch = f.launch; did.push('target launch ' + f.launch + ' months'); }
  if (f.pin) { a.pin = f.pin; a.pinRaw = f.pin; did.push('pin ' + f.pin); }
  if (f.lang) { a.lang = f.lang; did.push('training language ' + f.lang); S.letterLang[a.id] = f.lang; }
  if (spaceTouched || f.pin) a.notesSuperseded = true;
  return did;
}
